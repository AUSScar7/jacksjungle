<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pattern Pioneer - Jack's Jungle</title>
  <style>
    :root {
      --bg: #18141e; --card: #272132; --accent: #c084fc; --accent-dim: #9333ea;
      --text: #faf5ff; --muted: #e9d5ff; --danger: #ef4444; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    
    .ruin-wall {
      background: rgba(0, 0, 0, 0.4); border: 2px dashed var(--accent-dim); border-radius: 0.75rem;
      width: 100%; padding: 1.25rem 0.5rem; margin: 0.75rem 0; text-align: center;
    }
    .sequence-display {
      font-size: 2.2rem; font-weight: 800; letter-spacing: 0.25rem; color: #fff;
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.4rem;
      min-height: 3.5rem;
    }
    .slot-q {
      color: var(--accent); background: rgba(192, 132, 252, 0.15); border: 2px solid var(--accent);
      border-radius: 8px; min-width: 44px; height: 50px; display: inline-flex; align-items: center; justify-content: center;
    }
    .hint-text { font-size: 0.9rem; color: var(--muted); margin-top: 0.4rem; min-height: 1.2rem; text-align: center; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; width: 100%; margin-top: 0.75rem; }
    .glyph-btn {
      background: #3b324c; border: 2px solid var(--accent-dim); color: #fff; padding: 1rem 0.5rem;
      font-size: 1.8rem; font-weight: 800; border-radius: 0.6rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .glyph-btn:active { background: var(--accent-dim); transform: scale(0.97); }
    .glyph-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.92rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="glyph-counter">Ruin: 1 / 4</span>
    </div>
    <p style="color: var(--muted); font-size: 0.92rem; text-align: center;">What comes next in the pattern?</p>

    <div class="ruin-wall">
      <div class="sequence-display" id="sequence-text"></div>
      <div class="hint-text" id="pattern-hint"></div>
    </div>

    <div class="grid" id="choices-field"></div>
    <div class="status-msg" id="status-label"></div>
  </div>

  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      
      const alreadyFinished = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');

      if (alreadyFinished) {
        return false;
      }

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
      return true;
    }

    // 4 Progressive, kid-friendly sequences
    const SEQUENCES = [
      {
        tokens: ["▲", "■", "▲", "■"],
        correct: "▲",
        opts: ["▲", "●", "■"],
        hint: "Triangle, Square, Triangle, Square... what's next?"
      },
      {
        tokens: ["🥥", "🥥", "🍌", "🥥", "🥥"],
        correct: "🍌",
        opts: ["🥥", "🍌", "🌴"],
        hint: "Coconut, Coconut, Banana... Coconut, Coconut...?"
      },
      {
        tokens: ["🐸", "🦜", "🐒", "🐸", "🦜"],
        correct: "🐒",
        opts: ["🐸", "🦜", "🐒"],
        hint: "Frog, Toucan, Monkey... Frog, Toucan...?"
      },
      {
        tokens: ["2", "4", "6", "8"],
        correct: "10",
        opts: ["9", "10", "12"],
        hint: "Count up by 2s: 2, 4, 6, 8...?"
      }
    ];

    let sIdx = 0;

    function renderSequence() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (sIdx >= SEQUENCES.length) {
        document.getElementById('sequence-text').textContent = "RUINS DECODED! 🏛️";
        document.getElementById('pattern-hint').textContent = "All ancient stone glyphs aligned.";
        document.getElementById('choices-field').innerHTML = "";
        
        const isNew = awardGameCompletion('pattern_pioneer');
        status.style.color = "var(--success)";
        if (isNew) {
          status.textContent = "🍃 +20 Leaves Earned!";
        } else {
          status.textContent = "🌿 Ruins Re-solved! (Leaves already collected)";
        }
        
        playTone(520, 'sine', 0.2);
        setTimeout(() => playTone(659, 'sine', 0.25), 150);
        return;
      }

      const s = SEQUENCES[sIdx];
      document.getElementById('glyph-counter').textContent = `Ruin: ${sIdx + 1} / ${SEQUENCES.length}`;
      
      const seqBox = document.getElementById('sequence-text');
      seqBox.innerHTML = "";
      s.tokens.forEach(tok => {
        const sp = document.createElement('span');
        sp.textContent = tok;
        seqBox.appendChild(sp);
      });
      const qSlot = document.createElement('span');
      qSlot.className = "slot-q";
      qSlot.id = "active-slot";
      qSlot.textContent = "?";
      seqBox.appendChild(qSlot);

      document.getElementById('pattern-hint').textContent = s.hint;

      const fld = document.getElementById('choices-field');
      fld.innerHTML = "";
      s.opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'glyph-btn';
        b.textContent = opt;
        b.onclick = () => {
          if (opt === s.correct) {
            playTone(480, 'triangle', 0.15);
            document.getElementById('active-slot').textContent = opt;
            sIdx++;
            setTimeout(renderSequence, 350);
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = "Look closely at the pattern rhythm!";
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        fld.appendChild(b);
      });
    }

    renderSequence();
  </script>
</body>
</html>
