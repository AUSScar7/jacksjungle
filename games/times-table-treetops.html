<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Times Table Treetops - Jack's Jungle</title>
  <style>
    :root {
      --bg: #091a10; --card: #122e1d; --accent: #22c55e; --accent-dim: #15803d;
      --text: #f0fdf4; --muted: #86efac; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .equation { font-size: 3rem; font-weight: 800; color: #fff; margin: 1.5rem 0; letter-spacing: 0.1rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; width: 100%; }
    .ans-btn {
      background: #17422b; border: 2px solid var(--accent-dim); color: #fff; padding: 1rem;
      font-size: 1.5rem; font-weight: bold; border-radius: 0.6rem; cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .ans-btn:active { background: var(--accent-dim); }
    .ans-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="climb-lbl">Branch: 1 / 5</span>
    </div>
    <p style="color: var(--muted); font-size: 0.95rem;">Rapid Multiply to jump to the next branch:</p>
    <div class="equation" id="eq-text">6 &times; 7</div>
    <div class="grid" id="btn-grid"></div>
    <div class="status-msg" id="status-label"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    let branch = 0;
    function nextBranch() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (branch >= 5) {
        document.getElementById('eq-text').textContent = "SUMMIT REACHED!";
        document.getElementById('btn-grid').innerHTML = "";
        status.style.color = "var(--muted)";
        status.textContent = "🍃 +20 Leaves Earned!";
        awardGameCompletion('times_table_treetops');
        playTone(520, 'sine', 0.2);
        return;
      }
      document.getElementById('climb-lbl').textContent = `Branch: ${branch + 1} / 5`;
      const num1 = Math.floor(Math.random() * 8) + 3;
      const num2 = Math.floor(Math.random() * 8) + 3;
      const product = num1 * num2;
      document.getElementById('eq-text').innerHTML = `${num1} &times; ${num2}`;

      let choices = [product];
      while (choices.length < 4) {
        let fake = (num1 + Math.floor(Math.random() * 3) - 1) * num2 + (Math.floor(Math.random() * 6) - 3);
        if (fake > 0 && !choices.includes(fake)) choices.push(fake);
      }
      choices.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('btn-grid');
      grid.innerHTML = "";
      choices.forEach(val => {
        const b = document.createElement('button');
        b.className = 'ans-btn'; b.textContent = val;
        b.onclick = () => {
          if (val === product) {
            playTone(480, 'triangle', 0.15);
            branch++; nextBranch();
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = `Branch slipped! Check ${num1} × ${num2}.`;
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        grid.appendChild(b);
      });
    }
    nextBranch();
  </script>
</body>
</html>
