<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Anagram Antics - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1c1427; --card: #2c1c3e; --accent: #a855f7; --accent-dim: #7e22ce;
      --text: #f3e8ff; --muted: #d8b4fe; --danger: #ef4444; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; }
    .nav-btn { background: transparent; border: 1px solid var(--accent); color: var(--text); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    
    .clue-box { font-size: 1.1rem; color: var(--muted); margin-bottom: 1.25rem; text-align: center; min-height: 2.8rem; line-height: 1.4; }
    .tile-rack { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
    .letter-tile {
      background: #4c1d95; border: 2px solid var(--accent); color: #fff; width: 68px; height: 68px;
      font-size: 2.2rem; font-weight: 800; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.15s ease, background 0.15s ease;
    }
    .letter-tile:active { transform: scale(0.95); background: var(--accent-dim); }

    .ans-area { font-size: 2.4rem; letter-spacing: 0.4rem; min-height: 3.2rem; border-bottom: 3px solid var(--accent); width: 60%; text-align: center; color: #fff; margin-bottom: 1rem; }
    .ans-area.wrong {
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .btn-clear { background: #3b0764; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="anagram-stat">Word: 1 / 4</span>
    </div>
    
    <div class="clue-box" id="prompt-clue">Clue: Small furry pet that purrs 🐱</div>
    
    <div class="tile-rack" id="scramble-rack"></div>
    <div class="ans-area" id="typed-word"></div>
    
    <button class="btn-clear" onclick="clearLetters()">Reset Letters</button>
    <div class="status-msg" id="status-label"></div>
  </div>

  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      const alreadyFinished = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');

      if (alreadyFinished) return false;

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
      return true;
    }

    // Strictly 3-letter animal words
    const PUZZLES = [
      { word: "CAT", scramble: ["T", "A", "C"], clue: "Small furry pet that purrs and meows 🐱" },
      { word: "BAT", scramble: ["T", "B", "A"], clue: "Night creature with wings that sleeps upside-down 🦇" },
      { word: "FOX", scramble: ["X", "O", "F"], clue: "Clever wild animal with an orange bushy tail 🦊" },
      { word: "OWL", scramble: ["L", "W", "O"], clue: "Wise night bird that turns its head and says 'Hoo!' 🦉" }
    ];

    let pIdx = 0;
    let chosenLetters = [];

    function renderRound() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (pIdx >= PUZZLES.length) {
        document.getElementById('prompt-clue').textContent = "ALL ANAGRAMS UNSCRAMBLED! 🌟";
        document.getElementById('scramble-rack').innerHTML = "";
        document.getElementById('typed-word').textContent = "DONE!";
        
        const isNew = awardGameCompletion('anagram_antics');
        status.style.color = "var(--success)";
        if (isNew) {
          status.textContent = "🍃 +20 Leaves Earned!";
        } else {
          status.textContent = "🌿 Anagrams Re-cleared! (Leaves already collected)";
        }
        playTone(520, 'sine', 0.2);
        return;
      }

      const p = PUZZLES[pIdx];
      document.getElementById('anagram-stat').textContent = `Word: ${pIdx + 1} / ${PUZZLES.length}`;
      document.getElementById('prompt-clue').textContent = "Clue: " + p.clue;
      document.getElementById('typed-word').textContent = chosenLetters.join("");

      const rack = document.getElementById('scramble-rack');
      rack.innerHTML = "";
      p.scramble.forEach((char, idx) => {
        const btn = document.createElement('button');
        btn.className = "letter-tile";
        btn.textContent = char;
        btn.id = `tile-${idx}`;
        btn.onclick = () => selectTile(char, btn);
        rack.appendChild(btn);
      });
    }

    function selectTile(char, btn) {
      if (btn.style.visibility === 'hidden') return;
      chosenLetters.push(char);
      btn.style.visibility = 'hidden';
      playTone(440, 'triangle', 0.1);
      
      const p = PUZZLES[pIdx];
      document.getElementById('typed-word').textContent = chosenLetters.join("");

      if (chosenLetters.length === p.word.length) {
        const built = chosenLetters.join("");
        if (built === p.word) {
          playTone(587, 'sine', 0.2);
          pIdx++;
          chosenLetters = [];
          setTimeout(renderRound, 400);
        } else {
          playTone(160, 'sawtooth', 0.25, true);
          const area = document.getElementById('typed-word');
          area.classList.add('wrong');
          document.getElementById('status-label').textContent = "Not quite! Tap 'Reset Letters' to try again.";
          setTimeout(() => area.classList.remove('wrong'), 700);
        }
      }
    }

    function clearLetters() {
      chosenLetters = [];
      document.getElementById('typed-word').textContent = "";
      document.getElementById('status-label').textContent = "";
      document.querySelectorAll('.letter-tile').forEach(b => b.style.visibility = 'visible');
    }

    renderRound();
  </script>
</body>
</html>
