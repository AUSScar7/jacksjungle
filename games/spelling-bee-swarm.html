<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spelling Bee Swarm - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1c1917; --card: #292524; --accent: #facc15; --accent-dim: #ca8a04;
      --text: #fef08a; --border: #44403c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; }
    .nav-btn { background: transparent; border: 1px solid var(--accent); color: var(--text); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .listen-btn { background: var(--accent); color: #000; border: none; padding: 0.8rem 1.5rem; border-radius: 2rem; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin: 1rem 0; }
    .input-display { font-size: 2rem; letter-spacing: 0.2rem; min-height: 3rem; border-bottom: 2px solid var(--accent); margin-bottom: 1.2rem; width: 80%; text-align: center; color: #fff; }
    .keypad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; width: 100%; }
    .key-b { background: #44403c; border: 1px solid #57534e; color: #fff; padding: 0.6rem 0; font-size: 1.1rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .key-b:active { background: var(--accent-dim); }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="hive-stat">Word: 1 / 3</span>
    </div>
    <button class="listen-btn" onclick="speakCurrentWord()">🔊 Hear Word</button>
    <p style="font-size:0.85rem; color:#d6d3d1; margin-bottom:0.5rem;" id="clue-text">Clue: Large tropical snake</p>
    <div class="input-display" id="spelled-box"></div>
    <div class="keypad" id="keyboard"></div>
    <button style="margin-top:1rem; background:none; border:1px solid #78716c; color:#d6d3d1; padding:0.4rem 0.8rem; border-radius:4px; cursor:pointer;" onclick="clearWord()">Clear</button>
  </div>
  <script>
    const WORDS = [
      { word: "PYTHON", clue: "Large non-venomous constrictor snake" },
      { word: "FERN", clue: "Ancient green feather-shaped canopy plant" },
      { word: "JAGUAR", clue: "Strong spotted apex predator of the rainforest" }
    ];
    let wIdx = 0, buffer = "";
    function speakCurrentWord() {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(WORDS[wIdx].word);
        u.rate = 0.85; window.speechSynthesis.speak(u);
      } else {
        alert("Audio speech unavailable on this device. Word is: " + WORDS[wIdx].word);
      }
    }
    function renderUI() {
      if (wIdx >= WORDS.length) {
        document.getElementById('spelled-box').textContent = "SWARM CALMED!";
        document.getElementById('keyboard').innerHTML = "";
        let sun = parseInt(localStorage.getItem('jacksjungle_sunlight') || '0', 10);
        localStorage.setItem('jacksjungle_sunlight', sun + 20);
        localStorage.setItem('jacksjungle_completed_spelling_bee_swarm', 'true');
        return;
      }
      document.getElementById('hive-stat').textContent = `Word: ${wIdx + 1} / ${WORDS.length}`;
      document.getElementById('clue-text').textContent = "Clue: " + WORDS[wIdx].clue;
      document.getElementById('spelled-box').textContent = buffer;
    }
    function initKeys() {
      const kb = document.getElementById('keyboard');
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(ch => {
        const b = document.createElement('button');
        b.className = 'key-b'; b.textContent = ch;
        b.onclick = () => {
          buffer += ch;
          renderUI();
          if (buffer === WORDS[wIdx].word) {
            wIdx++; buffer = ""; renderUI();
          }
        };
        kb.appendChild(b);
      });
    }
    function clearWord() { buffer = ""; renderUI(); }
    initKeys(); renderUI();
  </script>
</body>
</html>
