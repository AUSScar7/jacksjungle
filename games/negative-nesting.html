  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Negative Nesting - Jack's Jungle</title>
  <style>
    :root {
      --bg: #0b132b; --card: #1c2541; --accent: #3a86ff; --accent-dim: #1d4ed8;
      --text: #f0fdf4; --muted: #93c5fd; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .temp-readout { font-size: 2.8rem; font-weight: 800; color: #fff; margin: 1.25rem 0; letter-spacing: 0.05rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; width: 100%; }
    .opt-btn {
      background: #243356; border: 2px solid var(--accent-dim); color: #fff; padding: 1rem;
      font-size: 1.3rem; font-weight: bold; border-radius: 0.6rem; cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .opt-btn:active { background: var(--accent-dim); }
    .opt-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="round-indicator">Roost: 1 / 4</span>
    </div>
    <p style="color: var(--muted); font-size: 0.95rem; text-align: center;" id="scenario-text"></p>
    <div class="temp-readout" id="target-temp">? °C</div>
    <div class="grid" id="choices-grid"></div>
    <div class="status-msg" id="status-label"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    const ROOSTS = [
      { text: "Starting at 3°C, the cold canopy wind drops the temperature by 7°C.", ans: -4, distractors: [-3, 4, -10] },
      { text: "At high altitude, it is -6°C. Morning sun warms it up by 9°C.", ans: 3, distractors: [-3, -15, 15] },
      { text: "The cave roost sits at -2°C, then drops another 5°C before dawn.", ans: -7, distractors: [-3, 3, 7] },
      { text: "Deep hollow temperature is -8°C. A thermal draft raises it by 11°C.", ans: 3, distractors: [-19, -3, 19] }
    ];
    let idx = 0;

    function renderRoost() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (idx >= ROOSTS.length) {
        document.getElementById('scenario-text').textContent = "All high-altitude roosts calculated!";
        document.getElementById('target-temp').textContent = "ROOST SECURE";
        document.getElementById('choices-grid').innerHTML = "";
        status.style.color = "var(--muted)";
        status.textContent = "🍃 +20 Leaves Earned!";
        awardGameCompletion('negative_nesting');
        playTone(520, 'sine', 0.2);
        return;
      }
      const r = ROOSTS[idx];
      document.getElementById('round-indicator').textContent = `Roost: ${idx + 1} / ${ROOSTS.length}`;
      document.getElementById('scenario-text').textContent = r.text;
      document.getElementById('target-temp').textContent = "? °C";

      let opts = [r.ans, ...r.distractors].sort(() => Math.random() - 0.5);
      const grid = document.getElementById('choices-grid');
      grid.innerHTML = "";
      opts.forEach(val => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = `${val > 0 ? '+' : ''}${val}°C`;
        b.onclick = () => {
          if (val === r.ans) {
            playTone(480, 'triangle', 0.15);
            idx++; renderRoost();
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = `Check direction on the temperature scale below 0°C!`;
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        grid.appendChild(b);
      });
    }
    renderRoost();
  </script>
</body>
</html>
