<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Termite Trail - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1a1208; --card: #2a1c0d; --accent: #f59e0b; --accent-dim: #b45309;
      --text: #fef3c7; --muted: #fde68a; --danger: #ef4444; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    
    .wood-bridge {
      background: rgba(0, 0, 0, 0.35); border: 2px dashed var(--accent-dim); border-radius: 0.75rem;
      width: 100%; padding: 1.5rem 1rem; margin: 1rem 0; text-align: center;
    }
    .eq-row { font-size: 2.6rem; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .op-slot {
      color: var(--accent); background: rgba(245, 158, 11, 0.15); border: 2px solid var(--accent);
      border-radius: 8px; min-width: 48px; height: 56px; display: inline-flex; align-items: center; justify-content: center;
    }
    .termite-helper { font-size: 0.9rem; color: var(--muted); margin-top: 0.5rem; min-height: 1.2rem; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; width: 100%; margin-top: 0.5rem; }
    .op-btn {
      background: #3d2913; border: 2px solid var(--accent); color: #fff; padding: 1.25rem 1rem;
      font-size: 2rem; font-weight: 900; border-radius: 0.75rem; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .op-btn span.label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .op-btn:active { background: var(--accent-dim); transform: scale(0.97); }
    .op-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="step-lbl">Bridge: 1 / 5</span>
    </div>
    <p style="color: var(--muted); font-size: 0.95rem; text-align: center;">Does the number get <strong>bigger</strong> or <strong>smaller</strong>?</p>
    
    <div class="wood-bridge">
      <div class="eq-row" id="eq-display">
        <span id="num-a">5</span>
        <span class="op-slot" id="slot-box">?</span>
        <span id="num-b">3</span>
        <span>=</span>
        <span id="num-res">8</span>
      </div>
      <div class="termite-helper" id="helper-text">Tip: 5 became 8, so we added more termites!</div>
    </div>

    <div class="grid" id="op-grid">
      <button class="op-btn" onclick="checkOp('+', this)">
        +
        <span class="label">ADD (Plus)</span>
      </button>
      <button class="op-btn" onclick="checkOp('-', this)">
        &minus;
        <span class="label">TAKE AWAY (Minus)</span>
      </button>
    </div>

    <div class="status-msg" id="status-label"></div>
  </div>

  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      
      const alreadyFinished = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');

      if (alreadyFinished) {
        return false;
      }

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
      return true;
    }

    // Friendly 5-bridge progression for Ages 6-10
    const PUZZLES = [
      { a: 5, b: 3, res: 8, op: '+', hint: "5 became 8 (it got bigger!)" },
      { a: 9, b: 4, res: 5, op: '-', hint: "9 became 5 (some marched away!)" },
      { a: 6, b: 6, res: 12, op: '+', hint: "Two groups of 6 joined together!" },
      { a: 10, b: 3, res: 7, op: '-', hint: "10 dropped down to 7!" },
      { a: 8, b: 7, res: 15, op: '+', hint: "8 climbed up to 15!" }
    ];
    let idx = 0;

    function renderEq() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (idx >= PUZZLES.length) {
        document.getElementById('eq-display').textContent = "BRIDGE BALANCED! 🐜";
        document.getElementById('helper-text').textContent = "All termites safely crossed the canyon.";
        document.getElementById('op-grid').innerHTML = "";
        
        const isNew = awardGameCompletion('termite_trail');
        status.style.color = "var(--success)";
        if (isNew) {
          status.textContent = "🍃 +20 Leaves Earned!";
        } else {
          status.textContent = "🌿 Bridge Re-crossed! (Leaves already collected)";
        }
        
        playTone(520, 'sine', 0.2);
        setTimeout(() => playTone(659, 'sine', 0.25), 150);
        return;
      }

      const p = PUZZLES[idx];
      document.getElementById('step-lbl').textContent = `Bridge: ${idx + 1} / ${PUZZLES.length}`;
      document.getElementById('num-a').textContent = p.a;
      document.getElementById('num-b').textContent = p.b;
      document.getElementById('num-res').textContent = p.res;
      document.getElementById('slot-box').textContent = "?";
      document.getElementById('helper-text').textContent = p.hint;
    }

    function checkOp(chosenOp, btn) {
      const p = PUZZLES[idx];
      if (chosenOp === p.op) {
        playTone(480, 'triangle', 0.15);
        document.getElementById('slot-box').textContent = chosenOp;
        idx++;
        setTimeout(renderEq, 400);
      } else {
        playTone(160, 'sawtooth', 0.25, true);
        btn.classList.add('wrong');
        const status = document.getElementById('status-label');
        status.textContent = chosenOp === '+' ? "Oops! Adding would make the number bigger." : "Oops! Minus would make the number smaller.";
        setTimeout(() => btn.classList.remove('wrong'), 700);
      }
    }

    renderEq();
  </script>
</body>
</html>
