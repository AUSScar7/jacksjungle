<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Food Web Weaver - Jack's Jungle</title>
  <style>
    :root {
      --bg: #0d1a10; --card: #182e1d; --accent: #22c55e; --accent-dim: #15803d;
      --text: #f0fdf4; --muted: #86efac;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .chain-diagram { font-size: 1.25rem; font-weight: bold; margin: 1.5rem 0; text-align: center; color: #fff; line-height: 1.6; }
    .blank-slot { color: var(--accent); border-bottom: 3px dashed var(--accent); padding: 0 0.4rem; }
    .grid { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }
    .opt-btn { background: #204128; border: 2px solid var(--accent-dim); color: #fff; padding: 1rem; font-size: 1.15rem; font-weight: bold; border-radius: 0.6rem; cursor: pointer; text-align: left; }
    .opt-btn:active { background: var(--accent-dim); }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="tier-counter">Web: 1 / 3</span>
    </div>
    <p style="color: var(--muted); font-size: 0.9rem;">Fill the missing biological trophic level:</p>
    <div class="chain-diagram" id="chain-view"></div>
    <div class="grid" id="choices-field"></div>
  </div>
  <script>
    const WEBS = [
      { chain: "Sunlight &rarr; Rainforest Fig (Producer) &rarr; <span class='blank-slot'>???</span> &rarr; Harpy Eagle (Apex)", correct: "Fruit Bat (Primary Consumer)", opts: ["Fruit Bat (Primary Consumer)", "Fungi (Decomposer)", "Jaguar (Apex)"] },
      { chain: "Sunlight &rarr; Canopy Fern &rarr; Caterpillar &rarr; <span class='blank-slot'>???</span> &rarr; Python", correct: "Tree Frog (Secondary Consumer)", opts: ["Tree Frog (Secondary Consumer)", "Soil Bacteria", "Wild Boar"] },
      { chain: "Dead Foliage &rarr; <span class='blank-slot'>???</span> &rarr; Soil Nutrients &rarr; Ancient Cedar", correct: "Termites (Decomposers)", opts: ["Termites (Decomposers)", "Ocelot (Predator)", "Macaw (Herbivore)"] }
    ];
    let wIdx = 0;
    function renderWeb() {
      if (wIdx >= WEBS.length) {
        document.getElementById('chain-view').innerHTML = "ECOSYSTEM BALANCED!";
        document.getElementById('choices-field').innerHTML = "<p style='text-align:center; font-weight:bold; color:var(--muted);'>+20 Leaves Added</p>";
        let l = parseInt(localStorage.getItem('jacksjungle_leaves') || '0', 10);
        localStorage.setItem('jacksjungle_leaves', l + 20);
        localStorage.setItem('jacksjungle_sunlight', l + 20);
        localStorage.setItem('jacksjungle_completed_food_web_weaver', 'true');
        return;
      }
      const item = WEBS[wIdx];
      document.getElementById('tier-counter').textContent = `Web: ${wIdx + 1} / ${WEBS.length}`;
      document.getElementById('chain-view').innerHTML = item.chain;

      const fld = document.getElementById('choices-field');
      fld.innerHTML = "";
      item.opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = opt;
        b.onclick = () => {
          if (opt === item.correct) {
            wIdx++; renderWeb();
          } else {
            alert("Check energy transfer hierarchy (Producer -> Consumer -> Apex)!");
          }
        };
        fld.appendChild(b);
      });
    }
    renderWeb();
  </script>
</body>
</html>
