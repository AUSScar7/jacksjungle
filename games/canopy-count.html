<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Canopy Count - Jack's Jungle</title>
  <style>
    :root {
      --bg: #0c1824; --card: #132238; --accent: #38bdf8; --accent-dim: #0284c7;
      --text: #f0f9ff; --muted: #7dd3fc; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .swarms { font-size: 2.2rem; min-height: 4.5rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.5rem; margin: 1.5rem 0; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; width: 100%; }
    .ans-btn {
      background: #1e3a5f; color: #fff; border: 2px solid var(--accent-dim); border-radius: 0.6rem;
      padding: 1rem; font-size: 1.4rem; font-weight: bold; cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .ans-btn:active { background: var(--accent-dim); }
    .ans-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="round-lbl">Round: 1 / 5</span>
    </div>
    <p style="color: var(--muted); font-size: 0.95rem;">Rapid Count: How many tree frogs are on the branch?</p>
    <div class="swarms" id="frog-box"></div>
    <div class="grid" id="ans-grid"></div>
    <div class="status-msg" id="status-label"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    let round = 0;
    function loadRound() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (round >= 5) {
        document.getElementById('frog-box').textContent = "COUNT COMPLETE!";
        document.getElementById('ans-grid').innerHTML = "";
        status.style.color = "var(--muted)";
        status.textContent = "🍃 +20 Leaves Earned!";
        awardGameCompletion('canopy_count');
        playTone(520, 'sine', 0.2);
        return;
      }
      document.getElementById('round-lbl').textContent = `Round: ${round + 1} / 5`;
      const count = Math.floor(Math.random() * 6) + 3;
      let frogs = "";
      for (let i = 0; i < count; i++) frogs += "🐸 ";
      document.getElementById('frog-box').textContent = frogs;

      let choices = [count];
      while (choices.length < 4) {
        let r = Math.floor(Math.random() * 8) + 2;
        if (!choices.includes(r)) choices.push(r);
      }
      choices.sort(() => Math.random() - 0.5);

      const ag = document.getElementById('ans-grid');
      ag.innerHTML = "";
      choices.forEach(c => {
        const b = document.createElement('button');
        b.className = 'ans-btn'; b.textContent = c;
        b.onclick = () => {
          if (c === count) {
            playTone(480, 'triangle', 0.15);
            round++; loadRound();
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = `Counted ${c}? Recount the frogs carefully!`;
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        ag.appendChild(b);
      });
    }
    loadRound();
  </script>
</body>
</html>
