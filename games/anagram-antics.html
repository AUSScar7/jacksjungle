<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Anagram Antics - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1e1b4b;
      --card: #2e2a72;
      --accent: #a855f7;
      --accent-dim: #7e22ce;
      --text: #faf5ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .box {
      background: var(--card);
      border: 2px solid var(--accent-dim);
      border-radius: 1rem;
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .top a {
      background: none; border: 1px solid var(--accent); color: var(--text);
      padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem;
    }
    .jumble { font-size: 2.2rem; font-weight: 800; letter-spacing: 0.3rem; margin: 1.5rem 0; color: #fff; }
    .picked-slots {
      display: flex; gap: 0.4rem; min-height: 48px; margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--accent); padding-bottom: 0.4rem;
    }
    .letter-chip {
      background: #4338ca; border: 1px solid var(--accent); color: #fff;
      font-size: 1.3rem; font-weight: bold; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer;
    }
    .pool { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <a href="../index.html">&larr; Canopy Hub</a>
      <span id="round">Round: 1 / 3</span>
    </div>
    <p style="font-size: 0.9rem; color: #d8b4fe;">Tap letters to identify the jungle animal:</p>
    <div class="jumble" id="jumble-view"></div>
    <div class="picked-slots" id="answer-row"></div>
    <div class="pool" id="pool-row"></div>
    <button style="margin-top:1.5rem; background:none; border:1px solid #c084fc; color:#fff; padding:0.5rem 1rem; border-radius:4px; font-weight:600; cursor:pointer;" onclick="resetTurn()">Reset Input</button>
  </div>

  <script>
    const ANAGRAMS = [
      { jumbled: "ALOK A", correct: "KOALA" },
      { jumbled: "GNROAAOK", correct: "KANGAROO" },
      { jumbled: "OMABWT", correct: "WOMBAT" }
    ];
    let step = 0;
    let currentInput = [];

    function loadGame() {
      if (step >= ANAGRAMS.length) {
        document.getElementById('jumble-view').textContent = "ALL SOLVED!";
        document.getElementById('pool-row').innerHTML = "<p style='color:#c084fc; font-weight:bold;'>+20 Sunlight Stored</p>";
        let s = parseInt(localStorage.getItem('jacksjungle_sunlight') || '0', 10);
        localStorage.setItem('jacksjungle_sunlight', s + 20);
        localStorage.setItem('jacksjungle_completed_anagram_antics', 'true');
        return;
      }
      currentInput = [];
      const item = ANAGRAMS[step];
      document.getElementById('round').textContent = `Round: ${step + 1} / ${ANAGRAMS.length}`;
      document.getElementById('jumble-view').textContent = item.jumbled;
      renderLetters();
    }

    function renderLetters() {
      const ansRow = document.getElementById('answer-row');
      ansRow.innerHTML = "";
      currentInput.forEach(ch => {
        const c = document.createElement('div');
        c.className = "letter-chip";
        c.textContent = ch;
        ansRow.appendChild(c);
      });

      const poolRow = document.getElementById('pool-row');
      poolRow.innerHTML = "";
      const item = ANAGRAMS[step];
      const chars = item.correct.split("").sort();
      chars.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = "letter-chip";
        btn.textContent = ch;
        btn.onclick = () => {
          currentInput.push(ch);
          renderLetters();
          if (currentInput.join("") === item.correct) {
            step++;
            loadGame();
          }
        };
        poolRow.appendChild(btn);
      });
    }

    function resetTurn() {
      currentInput = [];
      renderLetters();
    }

    loadGame();
  </script>
</body>
</html>
