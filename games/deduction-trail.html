<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Deduction Trail - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1c1017; --card: #2e1a26; --accent: #ec4899; --accent-dim: #be185d;
      --text: #fdf2f8; --muted: #fbcfe8; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .clues-box {
      background: rgba(0,0,0,0.35); border-left: 3px solid var(--accent); padding: 1rem;
      border-radius: 0.5rem; width: 100%; font-size: 0.95rem; line-height: 1.5; margin: 1rem 0;
    }
    .grid { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }
    .opt-btn {
      background: #442438; border: 2px solid var(--accent-dim); color: #fff; padding: 1rem;
      font-size: 1.15rem; font-weight: bold; border-radius: 0.6rem; cursor: pointer; text-align: left;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .opt-btn:active { background: var(--accent-dim); }
    .opt-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="case-counter">Case: 1 / 3</span>
    </div>
    <p style="color: var(--muted); font-size: 0.9rem;">Deduce the unknown creature from field notes:</p>
    <div class="clues-box" id="clues-content"></div>
    <div class="grid" id="suspects-grid"></div>
    <div class="status-msg" id="status-label"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    const CASES = [
      {
        clues: "1. The creature is warm-blooded.<br>2. It does not possess feathers.<br>3. It sleeps suspended from branches during the day.",
        correct: "Fruit Bat", opts: ["Harpy Eagle", "Tree Snake", "Fruit Bat"]
      },
      {
        clues: "1. It has claw marks on bark 2 meters high.<br>2. It is purely carnivorous.<br>3. It possesses a spotted coat pattern.",
        correct: "Jaguar", opts: ["Tapir", "Jaguar", "Spider Monkey"]
      },
      {
        clues: "1. It leaves wet tracks by the mudbanks.<br>2. It lays eggs in soft river sand.<br>3. It lacks external ear openings.",
        correct: "Freshwater Crocodile", opts: ["Otter", "Freshwater Crocodile", "Platypus"]
      }
    ];
    let cIdx = 0;

    function renderCase() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (cIdx >= CASES.length) {
        document.getElementById('clues-content').innerHTML = "ALL FIELD TRACKS SOLVED!";
        document.getElementById('suspects-grid').innerHTML = "";
        status.style.color = "var(--muted)";
        status.textContent = "🍃 +20 Leaves Earned!";
        awardGameCompletion('deduction_trail');
        playTone(520, 'sine', 0.2);
        return;
      }
      const c = CASES[cIdx];
      document.getElementById('case-counter').textContent = `Case: ${cIdx + 1} / ${CASES.length}`;
      document.getElementById('clues-content').innerHTML = c.clues;

      const sg = document.getElementById('suspects-grid');
      sg.innerHTML = "";
      c.opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = opt;
        b.onclick = () => {
          if (opt === c.correct) {
            playTone(480, 'triangle', 0.15);
            cIdx++; renderCase();
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = "Eliminate species that contradict the field notes!";
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        sg.appendChild(b);
      });
    }
    renderCase();
  </script>
</body>
</html>
