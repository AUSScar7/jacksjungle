<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Syllable Chop - Jack's Jungle</title>
  <style>
    :root {
      --bg: #061a12; --card: #0d2b1f; --accent: #22c55e; --accent-dim: #15803d;
      --text: #f8fafc; --muted: #86efac; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .word-display { font-size: 2.2rem; font-weight: 800; letter-spacing: 0.15rem; color: #fff; margin: 2rem 0; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; width: 100%; }
    .num-btn {
      background: #143d2c; color: var(--text); border: 2px solid var(--accent-dim);
      border-radius: 0.6rem; padding: 1rem; font-size: 1.5rem; font-weight: bold; cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .num-btn:active { background: var(--accent-dim); }
    .num-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; margin-top: 1rem; color: var(--danger); }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="round-indicator">Word: 1 / 5</span>
    </div>
    <p style="color: var(--muted); font-size: 0.95rem;">Count the syllables in the word:</p>
    <div class="word-display" id="word-target">CATERPILLAR</div>
    <div class="grid">
      <button class="num-btn" onclick="checkSyllables(1, this)">1</button>
      <button class="num-btn" onclick="checkSyllables(2, this)">2</button>
      <button class="num-btn" onclick="checkSyllables(3, this)">3</button>
      <button class="num-btn" onclick="checkSyllables(4, this)">4</button>
    </div>
    <div class="status-msg" id="status-label"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    const WORDS = [
      { word: "CATERPILLAR", count: 4 },
      { word: "JUNGLE", count: 2 },
      { word: "VINE", count: 1 },
      { word: "CANOPY", count: 3 },
      { word: "CROCODILE", count: 3 }
    ];
    let idx = 0;

    function renderWord() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (idx >= WORDS.length) {
        document.getElementById('word-target').textContent = "ALL CHOPPED!";
        document.querySelector('.grid').innerHTML = "";
        status.style.color = "var(--muted)";
        status.textContent = "🍃 +20 Leaves Earned!";
        awardGameCompletion('syllable_chop');
        playTone(520, 'sine', 0.2);
        return;
      }
      document.getElementById('round-indicator').textContent = `Word: ${idx + 1} / ${WORDS.length}`;
      document.getElementById('word-target').textContent = WORDS[idx].word;
    }

    function checkSyllables(n, btn) {
      if (n === WORDS[idx].count) {
        playTone(440, 'triangle', 0.15);
        idx++;
        renderWord();
      } else {
        playTone(160, 'sawtooth', 0.25, true);
        btn.classList.add('wrong');
        document.getElementById('status-label').textContent = `${n} is incorrect. Clapped beats do not match!`;
        setTimeout(() => btn.classList.remove('wrong'), 700);
      }
    }
    renderWord();
  </script>
</body>
</html>
