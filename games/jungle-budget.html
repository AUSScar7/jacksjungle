<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jungle Budget - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1c150c; --card: #2c2013; --accent: #eab308; --accent-dim: #ca8a04;
      --text: #fefce8; --muted: #fef08a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .balance-box { font-size: 2.2rem; font-weight: 800; color: #fff; margin: 1rem 0; }
    .prompt-text { font-size: 1rem; text-align: center; color: var(--muted); line-height: 1.5; margin-bottom: 1.5rem; }
    .grid { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }
    .opt-btn { background: #423019; border: 2px solid var(--accent-dim); color: #fff; padding: 1rem; font-size: 1.15rem; font-weight: bold; border-radius: 0.6rem; cursor: pointer; text-align: left; }
    .opt-btn:active { background: var(--accent-dim); }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="round-indicator">Expedition: 1 / 3</span>
    </div>
    <div class="balance-box" id="grant-display">Budget: $100 AUD</div>
    <p class="prompt-text" id="budget-scenario"></p>
    <div class="grid" id="choices-grid"></div>
  </div>
  <script>
    const EXPEDITIONS = [
      { grant: 100, prompt: "You buy a Solar Sensor for $35 AUD and 2 Water Test Kits for $15 AUD each. How much AUD remains?", correct: "$35 AUD", opts: ["$25 AUD", "$35 AUD", "$45 AUD"] },
      { grant: 150, prompt: "You rent climbing gear for $80 AUD and purchase a Field Net for $28 AUD. What is your remaining balance?", correct: "$42 AUD", opts: ["$32 AUD", "$42 AUD", "$52 AUD"] },
      { grant: 200, prompt: "A field drone costs $125 AUD. Replacement batteries cost $30 AUD. How much grant funding is left over?", correct: "$45 AUD", opts: ["$35 AUD", "$45 AUD", "$55 AUD"] }
    ];
    let eIdx = 0;
    function renderExpedition() {
      if (eIdx >= EXPEDITIONS.length) {
        document.getElementById('grant-display').textContent = "LEDGER BALANCED!";
        document.getElementById('budget-scenario').textContent = "All field expenses audited successfully.";
        document.getElementById('choices-grid').innerHTML = "<p style='text-align:center; font-weight:bold; color:var(--muted);'>+20 Leaves Added</p>";
        let l = parseInt(localStorage.getItem('jacksjungle_leaves') || '0', 10);
        localStorage.setItem('jacksjungle_leaves', l + 20);
        localStorage.setItem('jacksjungle_sunlight', l + 20);
        localStorage.setItem('jacksjungle_completed_jungle_budget', 'true');
        return;
      }
      const exp = EXPEDITIONS[eIdx];
      document.getElementById('round-indicator').textContent = `Expedition: ${eIdx + 1} / ${EXPEDITIONS.length}`;
      document.getElementById('grant-display').textContent = `Budget: $${exp.grant} AUD`;
      document.getElementById('budget-scenario').textContent = exp.prompt;

      const grid = document.getElementById('choices-grid');
      grid.innerHTML = "";
      exp.opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = opt;
        b.onclick = () => {
          if (opt === exp.correct) {
            eIdx++; renderExpedition();
          } else {
            alert("Recalculate subtraction from the initial balance!");
          }
        };
        grid.appendChild(b);
      });
    }
    renderExpedition();
  </script>
</body>
</html>
