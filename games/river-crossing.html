<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>River Crossing - Jack's Jungle</title>
  <style>
    :root {
      --bg: #091a18; --card: #132d29; --accent: #14b8a6; --accent-dim: #0f766e;
      --text: #f0fdfa; --muted: #99f6e4; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .river-scene {
      width: 100%; background: #0c201d; border: 1px solid var(--accent-dim); border-radius: 0.5rem;
      padding: 1rem; margin: 1rem 0; font-size: 0.95rem; line-height: 1.6;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .river-scene.wrong {
      background: #3d1419 !important;
      border-color: var(--danger) !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .bank { min-height: 2.5rem; border-bottom: 1px dashed var(--accent-dim); padding-bottom: 0.5rem; margin-bottom: 0.5rem; }
    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; width: 100%; }
    .action-btn {
      background: #19443e; border: 2px solid var(--accent-dim); color: #fff; padding: 0.85rem;
      font-weight: bold; border-radius: 0.5rem; cursor: pointer; font-size: 0.95rem;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .action-btn:active { background: var(--accent-dim); }
    .status-lbl { height: 1.5rem; font-weight: 600; color: var(--danger); font-size: 0.9rem; text-align: center; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span>Constraint Logic</span>
    </div>
    <p style="color: var(--muted); font-size: 0.85rem; text-align: center;">Rule: The Dingo cannot be left alone with the Bush Turkey without the Ranger!</p>
    <div class="river-scene" id="river-box">
      <div class="bank" id="left-bank"><strong>Left Bank:</strong> Ranger, Dingo, Turkey</div>
      <div class="bank" style="border-bottom:none;" id="right-bank"><strong>Right Bank:</strong> (Empty)</div>
    </div>
    <div class="btn-grid">
      <button class="action-btn" onclick="takeItem('Dingo')">Take Dingo</button>
      <button class="action-btn" onclick="takeItem('Turkey')">Take Turkey</button>
      <button class="action-btn" onclick="takeItem('Alone')">Row Alone</button>
      <button class="action-btn" style="border-color:#f87171; color:#f87171;" onclick="resetPuzzle()">Restart</button>
    </div>
    <div class="status-lbl" id="error-msg"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    let left = ['Dingo', 'Turkey'], right = [], rangerPos = 'left';
    let isFinished = false;

    function updateView() {
      document.getElementById('left-bank').innerHTML = `<strong>Left Bank:</strong> ${rangerPos === 'left' ? '🤠 Ranger, ' : ''}${left.join(', ') || '(Empty)'}`;
      document.getElementById('right-bank').innerHTML = `<strong>Right Bank:</strong> ${rangerPos === 'right' ? '🤠 Ranger, ' : ''}${right.join(', ') || '(Empty)'}`;

      const dingoOnLeft = left.includes('Dingo') && left.includes('Turkey') && rangerPos === 'right';
      const dingoOnRight = right.includes('Dingo') && right.includes('Turkey') && rangerPos === 'left';

      if (dingoOnLeft || dingoOnRight) {
        playTone(160, 'sawtooth', 0.3, true);
        const rBox = document.getElementById('river-box');
        rBox.classList.add('wrong');
        document.getElementById('error-msg').textContent = "The Dingo chased the Turkey away! Resetting crossing...";
        setTimeout(() => {
          rBox.classList.remove('wrong');
          resetPuzzle();
        }, 1200);
        return;
      }

      if (right.length === 2 && right.includes('Dingo') && right.includes('Turkey') && rangerPos === 'right' && !isFinished) {
        isFinished = true;
        playTone(520, 'sine', 0.2);
        document.getElementById('error-msg').style.color = 'var(--muted)';
        document.getElementById('error-msg').textContent = "CROSSING COMPLETE! 🍃 +20 Leaves Earned.";
        awardGameCompletion('river_crossing');
      }
    }

    function takeItem(item) {
      if (isFinished) return;
      document.getElementById('error-msg').textContent = "";
      if (rangerPos === 'left') {
        if (item !== 'Alone') {
          const idx = left.indexOf(item);
          if (idx === -1) return;
          left.splice(idx, 1);
          right.push(item);
        }
        rangerPos = 'right';
      } else {
        if (item !== 'Alone') {
          const idx = right.indexOf(item);
          if (idx === -1) return;
          right.splice(idx, 1);
          left.push(item);
        }
        rangerPos = 'left';
      }
      playTone(420, 'triangle', 0.1);
      updateView();
    }

    function resetPuzzle() {
      left = ['Dingo', 'Turkey']; right = []; rangerPos = 'left';
      document.getElementById('error-msg').textContent = "";
      updateView();
    }
    updateView();
  </script>
</body>
</html>
