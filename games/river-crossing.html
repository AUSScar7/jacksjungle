<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>River Crossing - Jack's Jungle</title>
  <style>
    :root {
      --bg: #091a18; --card: #132d29; --accent: #14b8a6; --accent-dim: #0f766e;
      --text: #f0fdfa; --muted: #99f6e4; --danger: #ef4444; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    
    .river-scene {
      width: 100%; background: #0c201d; border: 2px solid var(--accent-dim); border-radius: 0.75rem;
      padding: 1rem; margin: 0.75rem 0; display: flex; flex-direction: column; gap: 0.6rem;
    }
    .bank {
      background: rgba(0,0,0,0.3); border-radius: 6px; padding: 0.6rem 0.75rem; min-height: 48px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .bank-name { font-weight: bold; font-size: 0.85rem; color: var(--muted); }
    .animal-badges { display: flex; gap: 0.4rem; font-size: 1.6rem; }
    .raft-channel {
      background: rgba(20, 184, 166, 0.15); border: 1px dashed var(--accent); border-radius: 6px;
      padding: 0.5rem; text-align: center; font-size: 0.9rem; font-weight: bold; color: #fff;
    }

    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; width: 100%; margin-top: 0.5rem; }
    .action-btn {
      background: #19443e; border: 2px solid var(--accent); color: #fff; padding: 0.85rem 0.5rem;
      font-weight: bold; border-radius: 0.5rem; cursor: pointer; font-size: 0.95rem; text-align: center;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .action-btn:active { background: var(--accent-dim); transform: scale(0.97); }
    .action-btn.danger { border-color: #ef4444; color: #fca5a5; }
    .status-lbl { height: 1.5rem; font-weight: 600; color: var(--danger); font-size: 0.9rem; text-align: center; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span>Ranger Raft Patrol</span>
    </div>
    <p style="color: var(--muted); font-size: 0.88rem; text-align: center;">Rule: Don't leave the 🐊 Crocodile alone with the 🐨 Koala!</p>

    <div class="river-scene" id="river-box">
      <div class="bank" id="left-bank">
        <span class="bank-name">🌿 Home Bank:</span>
        <div class="animal-badges" id="left-badges">🐨 🐊</div>
      </div>
      <div class="raft-channel" id="raft-view">🛶 Ranger Raft: At Home Bank</div>
      <div class="bank" id="right-bank">
        <span class="bank-name">🌴 Across River:</span>
        <div class="animal-badges" id="right-badges"></div>
      </div>
    </div>

    <div class="btn-grid">
      <button class="action-btn" onclick="takeAnimal('Croc')">🛶 Take Crocodile</button>
      <button class="action-btn" onclick="takeAnimal('Koala')">🛶 Take Koala</button>
      <button class="action-btn" onclick="rowAlone()">Row Raft Alone</button>
      <button class="action-btn danger" onclick="resetRaft()">Restart Crossing</button>
    </div>

    <div class="status-lbl" id="error-msg"></div>
  </div>

  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      const alreadyFinished = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');

      if (alreadyFinished) return false;

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
      return true;
    }

    let left = ['Koala', 'Croc'];
    let right = [];
    let raftSide = 'left';
    let isWon = false;

    function updateDisplay() {
      const icons = { Koala: '🐨', Croc: '🐊' };
      document.getElementById('left-badges').textContent = left.map(a => icons[a]).join(' ');
      document.getElementById('right-badges').textContent = right.map(a => icons[a]).join(' ');
      document.getElementById('raft-view').textContent = `🛶 Ranger Raft: At ${raftSide === 'left' ? 'Home Bank' : 'Across River'}`;

      // Check danger: Crocodile alone with Koala on either bank without the ranger
      const leftDanger = (raftSide === 'right' && left.includes('Koala') && left.includes('Croc'));
      const rightDanger = (raftSide === 'left' && right.includes('Koala') && right.includes('Croc'));

      if (leftDanger || rightDanger) {
        playTone(160, 'sawtooth', 0.25, true);
        document.getElementById('error-msg').textContent = "Splash! The Crocodile scared the Koala into a tree! Try another passenger.";
        setTimeout(resetRaft, 1000);
        return;
      }

      // Check win condition
      if (right.includes('Koala') && right.includes('Croc') && !isWon) {
        isWon = true;
        playTone(520, 'sine', 0.2);
        setTimeout(() => playTone(659, 'sine', 0.25), 150);

        const isNew = awardGameCompletion('river_crossing');
        const err = document.getElementById('error-msg');
        err.style.color = "var(--success)";
        if (isNew) {
          err.textContent = "CROSSING COMPLETE! 🍃 +20 Leaves Earned.";
        } else {
          err.textContent = "🌿 Crossing Re-cleared! (Leaves already collected)";
        }
      }
    }

    function takeAnimal(animal) {
      if (isWon) return;
      document.getElementById('error-msg').textContent = "";

      if (raftSide === 'left') {
        if (!left.includes(animal)) return;
        left.splice(left.indexOf(animal), 1);
        right.push(animal);
        raftSide = 'right';
      } else {
        if (!right.includes(animal)) return;
        right.splice(right.indexOf(animal), 1);
        left.push(animal);
        raftSide = 'left';
      }
      playTone(440, 'triangle', 0.1);
      updateDisplay();
    }

    function rowAlone() {
      if (isWon) return;
      document.getElementById('error-msg').textContent = "";
      raftSide = (raftSide === 'left') ? 'right' : 'left';
      playTone(380, 'triangle', 0.1);
      updateDisplay();
    }

    function resetRaft() {
      left = ['Koala', 'Croc'];
      right = [];
      raftSide = 'left';
      isWon = false;
      document.getElementById('error-msg').textContent = "";
      updateDisplay();
    }
    updateDisplay();
  </script>
</body>
</html>
