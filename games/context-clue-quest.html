<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Context Clue Quest - Jack's Jungle</title>
  <style>
    :root {
      --bg: #061a12; --card: #0d2b1f; --accent: #22c55e; --accent-dim: #15803d;
      --text: #f8fafc; --muted: #86efac;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .passage { background: rgba(0,0,0,0.35); border-left: 3px solid var(--accent); padding: 1rem; border-radius: 0.4rem; font-size: 1.05rem; line-height: 1.5; margin: 1rem 0; color: #fff; }
    .highlight { color: var(--accent); font-weight: bold; text-decoration: underline; }
    .grid { display: flex; flex-direction: column; gap: 0.6rem; width: 100%; }
    .opt-btn { background: #143d2c; border: 2px solid var(--accent-dim); color: #fff; padding: 0.85rem; border-radius: 0.5rem; font-size: 1rem; cursor: pointer; font-weight: 600; text-align: left; }
    .opt-btn:active { background: var(--accent-dim); }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="stage-lbl">Passage: 1 / 3</span>
    </div>
    <div class="passage" id="passage-body"></div>
    <p style="font-size: 0.9rem; color: var(--muted); margin-bottom: 0.5rem;" id="query-lbl">What does the highlighted word mean?</p>
    <div class="grid" id="choices-box"></div>
  </div>
  <script>
    const PASSAGES = [
      {
        html: "The canopy fog was so <span class='highlight'>dense</span> that explorers could barely see the vines three feet ahead.",
        word: "dense", correct: "Thick and closely packed together",
        opts: ["Clear and open", "Thick and closely packed together", "Bright and hot"]
      },
      {
        html: "The chameleon remained <span class='highlight'>dormant</span> on the branch, not moving a single muscle for hours.",
        word: "dormant", correct: "Inactive or resting",
        opts: ["Running wildly", "Hunting aggressively", "Inactive or resting"]
      },
      {
        html: "Native seeds <span class='highlight'>thrive</span> in the nutrient-rich volcanic soil beneath the canopy.",
        word: "thrive", correct: "Grow vigorously and healthily",
        opts: ["Grow vigorously and healthily", "Dry out completely", "Freeze instantly"]
      }
    ];
    let pIdx = 0;
    function renderPassage() {
      if (pIdx >= PASSAGES.length) {
        document.getElementById('passage-body').textContent = "QUEST COMPLETE! Forest Floor Cleared.";
        document.getElementById('choices-box').innerHTML = "<p style='text-align:center; color:var(--muted); font-weight:bold;'>+20 Sunlight Added</p>";
        let sun = parseInt(localStorage.getItem('jacksjungle_sunlight') || '0', 10);
        localStorage.setItem('jacksjungle_sunlight', sun + 20);
        localStorage.setItem('jacksjungle_completed_context_clue_quest', 'true');
        return;
      }
      const p = PASSAGES[pIdx];
      document.getElementById('stage-lbl').textContent = `Passage: ${pIdx + 1} / ${PASSAGES.length}`;
      document.getElementById('passage-body').innerHTML = p.html;
      const cb = document.getElementById('choices-box');
      cb.innerHTML = "";
      p.opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'opt-btn'; b.textContent = opt;
        b.onclick = () => {
          if (opt === p.correct) {
            pIdx++; renderPassage();
          } else {
            alert("Reread the context and try again!");
          }
        };
        cb.appendChild(b);
      });
    }
    renderPassage();
  </script>
</body>
</html>
