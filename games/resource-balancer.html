<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Resource Balancer - Jack's Jungle</title>
  <style>
    :root {
      --bg: #141c14; --card: #202e20; --accent: #22c55e; --accent-dim: #15803d;
      --text: #f0fdf4; --muted: #86efac; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .meter-row { width: 100%; margin-bottom: 1rem; }
    .meter-lbl { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; margin-bottom: 0.3rem; }
    .bar-track { width: 100%; height: 14px; background: rgba(0,0,0,0.4); border-radius: 7px; overflow: hidden; border: 1px solid var(--accent-dim); }
    .bar-fill { height: 100%; width: 50%; transition: width 0.3s ease; }
    .bar-track.wrong {
      border-color: var(--danger) !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; width: 100%; margin-top: 1rem; }
    .act-btn {
      background: #164024; border: 2px solid var(--accent-dim); color: #fff; padding: 0.75rem 0.2rem;
      font-size: 0.85rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; text-align: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .act-btn:active { background: var(--accent-dim); }
    .cycle-count { font-size: 1.2rem; font-weight: 800; color: #fff; margin: 0.5rem 0; }
    .status-msg { height: 1.5rem; font-size: 0.9rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span>Multi-Variable Balancer</span>
    </div>
    <div class="cycle-count" id="cycle-label">Cycle: 1 / 4 (Target: Keep 30-80%)</div>
    <div class="meter-row">
      <div class="meter-lbl"><span>💧 Moisture Level</span><span id="moist-val">50%</span></div>
      <div class="bar-track" id="moist-track"><div class="bar-fill" id="moist-fill" style="width: 50%; background: #06b6d4;"></div></div>
    </div>
    <div class="meter-row">
      <div class="meter-lbl"><span>🐛 Parasite Mites</span><span id="mite-val">50%</span></div>
      <div class="bar-track" id="mite-track"><div class="bar-fill" id="mite-fill" style="width: 50%; background: #f87171;"></div></div>
    </div>
    <div class="meter-row">
      <div class="meter-lbl"><span>🌱 Soil Nitrogen</span><span id="nitro-val">50%</span></div>
      <div class="bar-track" id="nitro-track"><div class="bar-fill" id="nitro-fill" style="width: 50%; background: #22c55e;"></div></div>
    </div>
    <div class="actions">
      <button class="act-btn" onclick="applyAction('RAIN')">🌧️ Cloud Seeding (+Moist, -Nitro)</button>
      <button class="act-btn" onclick="applyAction('WASPS')">🐝 Introduce Wasps (-Mites, -Moist)</button>
      <button class="act-btn" onclick="applyAction('MULCH')">🍂 Add Mulch (+Nitro, +Mites)</button>
    </div>
    <div class="status-msg" id="status-out"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    let moisture = 50, mites = 50, nitrogen = 50;
    let cycles = 1;
    let isWon = false;

    function updateBars() {
      document.getElementById('moist-val').textContent = `${moisture}%`;
      document.getElementById('moist-fill').style.width = `${moisture}%`;
      document.getElementById('mite-val').textContent = `${mites}%`;
      document.getElementById('mite-fill').style.width = `${mites}%`;
      document.getElementById('nitro-val').textContent = `${nitrogen}%`;
      document.getElementById('nitro-fill').style.width = `${nitrogen}%`;
    }

    function applyAction(type) {
      if (isWon) return;
      document.getElementById('status-out').textContent = '';

      if (type === 'RAIN') {
        moisture = Math.min(100, moisture + 20);
        nitrogen = Math.max(0, nitrogen - 15);
      } else if (type === 'WASPS') {
        mites = Math.max(0, mites - 25);
        moisture = Math.max(0, moisture - 10);
      } else if (type === 'MULCH') {
        nitrogen = Math.min(100, nitrogen + 25);
        mites = Math.min(100, mites + 15);
      }
      playTone(440, 'triangle', 0.1);

      // Check bounds (30% to 80%)
      let failedTrack = null;
      let failReason = '';
      if (moisture < 25 || moisture > 85) {
        failedTrack = document.getElementById('moist-track');
        failReason = 'Moisture levels breached ecological safety!';
      } else if (mites > 80) {
        failedTrack = document.getElementById('mite-track');
        failReason = 'Parasite mites overran the foliage!';
      } else if (nitrogen < 25) {
        failedTrack = document.getElementById('nitro-track');
        failReason = 'Soil nitrogen depleted!';
      }

      if (failedTrack) {
        playTone(160, 'sawtooth', 0.3, true);
        failedTrack.classList.add('wrong');
        document.getElementById('status-out').textContent = failReason;
        setTimeout(() => {
          failedTrack.classList.remove('wrong');
          moisture = 50; mites = 50; nitrogen = 50; cycles = 1;
          document.getElementById('cycle-label').textContent = `Cycle: 1 / 4 (Target: Keep 30-80%)`;
          document.getElementById('status-out').textContent = '';
          updateBars();
        }, 1200);
        return;
      }

      cycles++;
      if (cycles > 4) {
        isWon = true;
        playTone(520, 'sine', 0.2);
        setTimeout(() => playTone(659, 'sine', 0.25), 150);
        const status = document.getElementById('status-out');
        status.style.color = 'var(--muted)';
        status.textContent = 'CANOPY EQUILIBRIUM STABILIZED! 🍃 +20 Leaves Earned.';
        awardGameCompletion('resource_balancer');
        cycles = 4;
      }
      document.getElementById('cycle-label').textContent = `Cycle: ${cycles} / 4 (Target: Keep 30-80%)`;
      updateBars();
    }
  </script>
</body>
</html>
