<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Homophone Haven - Jack's Jungle</title>
  <style>
    :root {
      --bg: #061a12; --card: #0d2b1f; --accent: #22c55e; --accent-dim: #15803d;
      --text: #f8fafc; --muted: #86efac; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .sentence-box { font-size: 1.25rem; font-weight: 600; line-height: 1.6; text-align: center; margin: 1.5rem 0; min-height: 4rem; }
    .blank { color: var(--accent); border-bottom: 2px dashed var(--accent); padding: 0 0.3rem; }
    .choices-col { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }
    .choice-btn {
      background: #143d2c; color: var(--text); border: 2px solid var(--accent-dim);
      border-radius: 0.6rem; padding: 1rem; font-size: 1.2rem; font-weight: bold; cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .choice-btn:active { background: var(--accent-dim); }
    .choice-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.6rem; font-size: 0.95rem; font-weight: 600; text-align: center; margin-top: 1rem; color: var(--danger); }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="level-lbl">Sentence: 1 / 4</span>
    </div>
    <p style="color: var(--muted); font-size: 0.9rem;">Choose the correct spelling for the sentence:</p>
    <div class="sentence-box" id="sentence-prompt"></div>
    <div class="choices-col" id="options-col"></div>
    <div class="status-msg" id="status-label"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, duration, isError = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isError) {
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + duration);
      }
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    const QUESTS = [
      { text: "The toucan built <span class='blank'>___</span> nest in the hollow branch.", correct: "their", opts: ["there", "their", "they're"] },
      { text: "We spotted a wild <span class='blank'>___</span> bounding through the scrub.", correct: "hare", opts: ["hair", "hare"] },
      { text: "Sunlight broke <span class='blank'>___</span> the high forest canopy.", correct: "through", opts: ["threw", "through"] },
      { text: "The river current was too <span class='blank'>___</span> to stop our canoe.", correct: "weak", opts: ["weak", "week"] }
    ];
    let qIdx = 0;

    function renderQuest() {
      const status = document.getElementById('status-label');
      status.textContent = "";
      status.style.color = "var(--danger)";

      if (qIdx >= QUESTS.length) {
        document.getElementById('sentence-prompt').innerHTML = "HAVEN MASTERED!";
        document.getElementById('options-col').innerHTML = "";
        status.style.color = "var(--muted)";
        status.textContent = "🍃 +20 Leaves Earned!";
        
        awardGameCompletion('homophone_haven');
        
        playTone(523.25, 'sine', 0.2);
        setTimeout(() => playTone(659.25, 'sine', 0.3), 150);
        return;
      }

      const q = QUESTS[qIdx];
      document.getElementById('level-lbl').textContent = `Sentence: ${qIdx + 1} / ${QUESTS.length}`;
      document.getElementById('sentence-prompt').innerHTML = q.text;
      const col = document.getElementById('options-col');
      col.innerHTML = "";

      q.opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.textContent = opt;
        b.onclick = () => {
          if (opt === q.correct) {
            playTone(520, 'triangle', 0.15);
            qIdx++;
            renderQuest();
          } else {
            playTone(160, 'sawtooth', 0.3, true);
            b.classList.add('wrong');
            status.textContent = `"${opt}" is incorrect. Try the matching homophone!`;
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        col.appendChild(b);
      });
    }
    renderQuest();
  </script>
</body>
</html>
