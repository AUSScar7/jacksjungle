<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The False Log - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1c1417; --card: #2e1d23; --accent: #f43f5e; --accent-dim: #be123c;
      --text: #fff1f2; --muted: #fecdd3; --danger: #ef4444; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    
    .log-card {
      background: rgba(0,0,0,0.35); border-left: 4px solid var(--accent); padding: 1.1rem;
      border-radius: 0.5rem; width: 100%; margin: 0.75rem 0; min-height: 5.5rem;
    }
    .log-text { font-size: 1.05rem; line-height: 1.5; color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; width: 100%; margin-top: 0.5rem; }
    .verdict-btn {
      background: #44242e; border: 2px solid var(--accent); color: #fff; padding: 1.15rem 0.5rem;
      font-size: 1.15rem; font-weight: 900; border-radius: 0.6rem; cursor: pointer; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .verdict-btn span.sub { font-size: 0.8rem; color: var(--muted); font-weight: normal; }
    .verdict-btn:active { background: var(--accent-dim); transform: scale(0.97); }
    .verdict-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.92rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="log-count">Field Note: 1 / 3</span>
    </div>
    <p style="color: var(--muted); font-size: 0.92rem; text-align: center;">Is this ranger field report a Real Fact or a Silly Guess?</p>

    <div class="log-card">
      <div class="log-text" id="report-text"></div>
    </div>

    <div class="grid" id="choices-field">
      <button class="verdict-btn" onclick="checkVerdict(true, this)">
        <span>🔍 Real Fact</span>
        <span class="sub">Makes scientific sense</span>
      </button>
      <button class="verdict-btn" onclick="checkVerdict(false, this)">
        <span>❌ Silly Guess</span>
        <span class="sub">Faulty reasoning / Myth</span>
      </button>
    </div>

    <div class="status-msg" id="status-label"></div>
  </div>

  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      const alreadyFinished = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');

      if (alreadyFinished) return false;

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
      return true;
    }

    // Concrete reasoning prompts for kids
    const NOTES = [
      {
        text: "\"Tree frogs start croaking loudly right before a storm starts. Therefore, tree frog songs create rain clouds in the sky!\"",
        isFact: false,
        hint: "Frogs feel rain humidity coming, but their songs don't make the rain fall!"
      },
      {
        text: "\"Green tree leaves take in bright sunlight and rain water to make sweet food and sugar so the tree can grow tall.\"",
        isFact: true,
        hint: "This is photosynthesis—plants genuinely use sun and water to grow!"
      },
      {
        text: "\"I walked 10 meters into the 100,000-acre rainforest today and saw zero koalas. That proves koalas do not exist in Australia!\"",
        isFact: false,
        hint: "Searching only 10 meters is way too small to prove animals aren't living elsewhere!"
      }
    ];

    let lIdx = 0;

    function renderNote() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (lIdx >= NOTES.length) {
        document.getElementById('report-text').textContent = "ALL SCIENTIFIC FIELD NOTES AUDITED! Master Critical Thinker.";
        document.getElementById('choices-field').innerHTML = "";

        const isNew = awardGameCompletion('the_false_log');
        status.style.color = "var(--success)";
        if (isNew) {
          status.textContent = "🍃 +20 Leaves Earned!";
        } else {
          status.textContent = "🌿 Log Re-audited! (Leaves already collected)";
        }

        playTone(520, 'sine', 0.2);
        setTimeout(() => playTone(659, 'sine', 0.25), 150);
        return;
      }

      const item = NOTES[lIdx];
      document.getElementById('log-count').textContent = `Field Note: ${lIdx + 1} / ${NOTES.length}`;
      document.getElementById('report-text').textContent = item.text;
    }

    function checkVerdict(userSaidFact, btn) {
      const item = NOTES[lIdx];
      if (userSaidFact === item.isFact) {
        playTone(480, 'triangle', 0.15);
        lIdx++;
        renderNote();
      } else {
        playTone(160, 'sawtooth', 0.25, true);
        btn.classList.add('wrong');
        document.getElementById('status-label').textContent = item.hint;
        setTimeout(() => btn.classList.remove('wrong'), 700);
      }
    }

    renderNote();
  </script>
</body>
</html>
