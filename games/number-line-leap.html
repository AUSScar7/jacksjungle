<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Number Line Leap - Jack's Jungle</title>
  <style>
    :root {
      --bg: #09171e; --card: #122834; --accent: #06b6d4; --accent-dim: #0891b2;
      --text: #ecfeff; --muted: #a5f3fc; --danger: #ef4444; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    
    .story-card {
      background: rgba(0, 0, 0, 0.35); border: 2px dashed var(--accent-dim); border-radius: 0.75rem;
      width: 100%; padding: 1.25rem 1rem; margin: 0.75rem 0; text-align: center;
    }
    .story-clue { font-size: 1.15rem; font-weight: 700; color: #fff; line-height: 1.4; }
    .story-sub { font-size: 0.9rem; color: var(--muted); margin-top: 0.35rem; }

    /* Visual Number Line */
    .line-track {
      width: 100%; background: #081b24; border: 2px solid var(--accent-dim); border-radius: 8px;
      padding: 1rem 0.5rem 0.5rem; margin: 0.75rem 0; position: relative;
    }
    .ticks { display: flex; justify-content: space-between; position: relative; border-bottom: 3px solid var(--accent); padding-bottom: 6px; }
    .tick {
      font-size: 0.85rem; font-weight: 800; color: var(--muted); position: relative; text-align: center; width: 20px;
    }
    .tick::after {
      content: ""; position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
      width: 2px; height: 8px; background: var(--accent);
    }
    .frog-marker {
      font-size: 1.6rem; position: absolute; top: -14px; transition: left 0.3s ease;
      transform: translateX(-50%);
    }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.65rem; width: 100%; margin-top: 0.75rem; }
    .ans-btn {
      background: #154559; border: 2px solid var(--accent); color: #fff; padding: 1rem 0.5rem;
      font-size: 1.5rem; font-weight: 900; border-radius: 0.6rem; cursor: pointer; text-align: center;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .ans-btn:active { background: var(--accent-dim); transform: scale(0.97); }
    .ans-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.92rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="round-lbl">Leap: 1 / 4</span>
    </div>
    <p style="color: var(--muted); font-size: 0.92rem; text-align: center;">Help the tree frog leap along the vine!</p>

    <div class="line-track">
      <span class="frog-marker" id="frog-pos" style="left: 0%;">🐸</span>
      <div class="ticks" id="tick-bar"></div>
    </div>

    <div class="story-card">
      <div class="story-clue" id="prompt-math">Start at 2. Leap forward 3 pads.</div>
      <div class="story-sub" id="prompt-hint">2 + 3 = ?</div>
    </div>

    <div class="grid" id="choices-field"></div>
    <div class="status-msg" id="status-label"></div>
  </div>

  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function recordCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      const alreadyDone = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');
      return !alreadyDone;
    }

    // Number line 0 to 10
    const LEAPS = [
      { start: 2, leap: 3, ans: 5, clue: "Start at 2. Leap forward 3 pads:", hint: "2 + 3 = ?", opts: [4, 5, 6] },
      { start: 4, leap: 4, ans: 8, clue: "Start at 4. Leap forward 4 pads:", hint: "4 + 4 = ?", opts: [7, 8, 9] },
      { start: 7, leap: -3, ans: 4, clue: "Start at 7. Hop backward 3 pads:", hint: "7 - 3 = ?", opts: [3, 4, 5] },
      { start: 3, leap: 6, ans: 9, clue: "Start at 3. Big leap forward 6 pads:", hint: "3 + 6 = ?", opts: [8, 9, 10] }
    ];
    let lIdx = 0;

    function buildTicks() {
      const bar = document.getElementById('tick-bar');
      bar.innerHTML = '';
      for (let i = 0; i <= 10; i++) {
        const d = document.createElement('div');
        d.className = 'tick';
        d.textContent = i;
        bar.appendChild(d);
      }
    }

    function renderLeap() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (lIdx >= LEAPS.length) {
        document.getElementById('prompt-math').textContent = "POND REACHED! 🐸";
        document.getElementById('prompt-hint').textContent = "All number line leaps completed.";
        document.getElementById('choices-field').innerHTML = "";
        document.getElementById('frog-pos').style.left = "100%";
        
        recordCompletion('number_line_leap');
        status.style.color = "var(--success)";
        status.textContent = "🌿 Wetland Restored! Habitat Grown.";
        
        playTone(520, 'sine', 0.2);
        setTimeout(() => playTone(659, 'sine', 0.25), 150);
        return;
      }

      const q = LEAPS[lIdx];
      document.getElementById('round-lbl').textContent = `Leap: ${lIdx + 1} / ${LEAPS.length}`;
      document.getElementById('prompt-math').textContent = q.clue;
      document.getElementById('prompt-hint').textContent = q.hint;
      
      // Position frog at starting tick (percentage of 0-10)
      const pct = (q.start / 10) * 100;
      document.getElementById('frog-pos').style.left = `${pct}%`;

      const fld = document.getElementById('choices-field');
      fld.innerHTML = '';
      q.opts.forEach(val => {
        const b = document.createElement('button');
        b.className = 'ans-btn';
        b.textContent = val;
        b.onclick = () => {
          if (val === q.ans) {
            playTone(480, 'triangle', 0.15);
            // Hop to answer
            document.getElementById('frog-pos').style.left = `${(q.ans / 10) * 100}%`;
            lIdx++;
            setTimeout(renderLeap, 450);
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = "Count each pad one by one along the line!";
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        fld.appendChild(b);
      });
    }

    buildTicks();
    renderLeap();
  </script>
</body>
</html>
