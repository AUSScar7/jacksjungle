<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shape Safari - Jack's Jungle</title>
  <style>
    :root {
      --bg: #151a08; --card: #252e0e; --accent: #84cc16; --accent-dim: #65a30d;
      --text: #f7fee7; --muted: #d9f99d; --danger: #ef4444; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    
    .display-card {
      background: rgba(0,0,0,0.35); border: 2px dashed var(--accent-dim); border-radius: 0.75rem;
      width: 100%; padding: 1.5rem 1rem; margin: 0.75rem 0; text-align: center;
    }
    .shape-hero { font-size: 4.5rem; margin-bottom: 0.5rem; }
    .shape-clue { font-size: 1.1rem; font-weight: 700; color: #fff; line-height: 1.4; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; width: 100%; margin-top: 0.5rem; }
    .shape-btn {
      background: #354215; border: 2px solid var(--accent); color: #fff; padding: 1rem;
      font-size: 1.15rem; font-weight: 900; border-radius: 0.6rem; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .shape-btn span.sub { font-size: 0.8rem; color: var(--muted); font-weight: normal; }
    .shape-btn:active { background: var(--accent-dim); transform: scale(0.97); }
    .shape-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.92rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="target-count">Safari: 1 / 4</span>
    </div>
    <p style="color: var(--muted); font-size: 0.95rem; text-align: center;">Count the sides and corners to spot the shape!</p>
    
    <div class="display-card">
      <div class="shape-hero" id="shape-icon">🔺</div>
      <div class="shape-clue" id="clue-text">I have 3 straight sides and 3 sharp corners.</div>
    </div>

    <div class="grid" id="choices-grid"></div>
    <div class="status-msg" id="status-label"></div>
  </div>

  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      const alreadyFinished = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');

      if (alreadyFinished) return false;

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
      return true;
    }

    // 4 High-engagement shape rounds for ages 6-10
    const SHAPES = [
      {
        icon: "🔺",
        clue: "I have 3 straight sides and 3 pointy corners!",
        ans: "Triangle",
        opts: [
          { name: "Triangle", sub: "3 Sides" },
          { name: "Square", sub: "4 Equal Sides" },
          { name: "Circle", sub: "Round Curve" },
          { name: "Hexagon", sub: "6 Sides" }
        ],
        hint: "Count: 1, 2, 3 sides = Triangle!"
      },
      {
        icon: "🟩",
        clue: "I have 4 equal sides and 4 square corners!",
        ans: "Square",
        opts: [
          { name: "Square", sub: "4 Equal Sides" },
          { name: "Triangle", sub: "3 Sides" },
          { name: "Star", sub: "5 Points" },
          { name: "Circle", sub: "0 Straight Sides" }
        ],
        hint: "All 4 sides are exactly the same length!"
      },
      {
        icon: "🟡",
        clue: "I have 0 straight sides and 0 sharp corners. I roll smoothly!",
        ans: "Circle",
        opts: [
          { name: "Circle", sub: "0 Straight Sides" },
          { name: "Square", sub: "4 Sides" },
          { name: "Rectangle", sub: "4 Sides" },
          { name: "Pentagon", sub: "5 Sides" }
        ],
        hint: "It's round like the full jungle moon!"
      },
      {
        icon: "⬡",
        clue: "I have 6 straight sides, just like a honeybee's comb!",
        ans: "Hexagon",
        opts: [
          { name: "Hexagon", sub: "6 Sides" },
          { name: "Triangle", sub: "3 Sides" },
          { name: "Square", sub: "4 Sides" },
          { name: "Octagon", sub: "8 Sides" }
        ],
        hint: "Count the 6 flat edges around the outside!"
      }
    ];

    let sIdx = 0;

    function renderRound() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (sIdx >= SHAPES.length) {
        document.getElementById('shape-icon').textContent = "🏆";
        document.getElementById('clue-text').textContent = "SHAPE SAFARI MASTERED! You spotted every jungle shape.";
        document.getElementById('choices-grid').innerHTML = "";

        const isNew = awardGameCompletion('angle_archer');
        status.style.color = "var(--success)";
        if (isNew) {
          status.textContent = "🍃 +20 Leaves Earned!";
        } else {
          status.textContent = "🌿 Safari Re-cleared! (Leaves already collected)";
        }

        playTone(520, 'sine', 0.2);
        setTimeout(() => playTone(659, 'sine', 0.25), 150);
        return;
      }

      const s = SHAPES[sIdx];
      document.getElementById('target-count').textContent = `Safari: ${sIdx + 1} / ${SHAPES.length}`;
      document.getElementById('shape-icon').textContent = s.icon;
      document.getElementById('clue-text').textContent = s.clue;

      const grid = document.getElementById('choices-grid');
      grid.innerHTML = "";
      s.opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'shape-btn';
        b.innerHTML = `<span>${opt.name}</span><span class="sub">${opt.sub}</span>`;
        b.onclick = () => {
          if (opt.name === s.ans) {
            playTone(480, 'triangle', 0.15);
            sIdx++;
            renderRound();
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = s.hint;
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        grid.appendChild(b);
      });
    }

    renderRound();
  </script>
</body>
</html>
