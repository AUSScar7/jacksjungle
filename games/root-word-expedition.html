<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Root Word Expedition - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1c130b; --card: #2d1f14; --accent: #f97316; --accent-dim: #c2410c;
      --text: #ffedd5; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .exp-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .nav { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .nav a { background: none; border: 1px solid var(--accent-dim); color: var(--text); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .compound-word { font-size: 2.2rem; font-weight: bold; margin: 1.5rem 0; color: #fff; letter-spacing: 0.1rem; }
    .btn-col { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }
    .choice-btn {
      background: #422d1d; border: 2px solid var(--accent-dim); color: var(--text);
      padding: 0.95rem; font-size: 1.15rem; border-radius: 0.6rem; font-weight: 600; cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .choice-btn:active { background: var(--accent-dim); }
    .choice-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="exp-box">
    <div class="nav">
      <a href="../index.html">&larr; Canopy Hub</a>
      <span id="level-indicator">Sample: 1 / 4</span>
    </div>
    <p style="font-size: 0.95rem; color: #fdba74;">Identify the core root morpheme:</p>
    <div class="compound-word" id="target-word">UNHEALTHY</div>
    <div class="btn-col" id="btn-stack"></div>
    <div class="status-msg" id="status-out"></div>
  </div>

  <script>
    let audioCtx = null;
    function playBeep(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    const STAGES = [
      { word: "UNHEALTHY", root: "HEALTH", choices: ["UN", "HEALTH", "THY", "HEAL"] },
      { word: "DISCOVERY", root: "COVER", choices: ["DIS", "VERY", "COVER", "COVE"] },
      { word: "REPLANTING", root: "PLANT", choices: ["RE", "PLANT", "ING", "PLAN"] },
      { word: "PREDICTION", root: "DICT", choices: ["PRE", "TION", "DICT", "PRED"] }
    ];
    let idx = 0;

    function render() {
      const status = document.getElementById('status-out');
      status.textContent = "";

      if (idx >= STAGES.length) {
        document.getElementById('target-word').textContent = "EXPEDITION CLEAR!";
        document.getElementById('btn-stack').innerHTML = "";
        status.style.color = "#fdba74";
        status.textContent = "🍃 +20 Leaves Earned!";
        
        let l = parseInt(localStorage.getItem('jacksjungle_leaves') || '0', 10);
        localStorage.setItem('jacksjungle_leaves', l + 20);
        localStorage.setItem('jacksjungle_sunlight', l + 20);
        localStorage.setItem('jacksjungle_completed_root_word_expedition', 'true');
        
        playBeep(523.25, 'sine', 0.2);
        return;
      }

      const s = STAGES[idx];
      document.getElementById('level-indicator').textContent = `Sample: ${idx + 1} / ${STAGES.length}`;
      document.getElementById('target-word').textContent = s.word;
      const stack = document.getElementById('btn-stack');
      stack.innerHTML = "";

      s.choices.forEach(ch => {
        const b = document.createElement('button');
        b.className = "choice-btn";
        b.textContent = ch;
        b.onclick = () => {
          if (ch === s.root) {
            playBeep(480, 'triangle', 0.15);
            idx++;
            render();
          } else {
            playBeep(150, 'sawtooth', 0.3, true);
            b.classList.add('wrong');
            status.textContent = `"${ch}" is an affix. Find the base root word!`;
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        stack.appendChild(b);
      });
    }
    render();
  </script>
</body>
</html>
