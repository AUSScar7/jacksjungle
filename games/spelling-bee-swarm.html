<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spelling Bee Swarm - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1c1917; --card: #292524; --accent: #facc15; --accent-dim: #ca8a04;
      --text: #fef08a; --border: #44403c; --danger: #ef4444; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; }
    .nav-btn { background: transparent; border: 1px solid var(--accent); color: var(--text); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .listen-btn { background: var(--accent); color: #000; border: none; padding: 0.8rem 1.5rem; border-radius: 2rem; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin: 0.75rem 0; }
    .listen-btn:active { background: var(--accent-dim); }
    .input-display { font-size: 2.2rem; letter-spacing: 0.3rem; min-height: 3rem; border-bottom: 2px solid var(--accent); margin-bottom: 1rem; width: 80%; text-align: center; color: #fff; }
    .input-display.wrong {
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .keypad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; width: 100%; }
    .key-b { background: #44403c; border: 1px solid #57534e; color: #fff; padding: 0.75rem 0; font-size: 1.2rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .key-b:active { background: var(--accent-dim); }
    .status-msg { height: 1.4rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="hive-stat">Word: 1 / 3</span>
    </div>
    <button class="listen-btn" id="hear-btn" onclick="speakCurrentWord()">🔊 Hear Word</button>
    <p style="font-size:0.9rem; color:#d6d3d1; margin-bottom:0.5rem;" id="clue-text">Clue: Buzzing insect that makes sweet honey</p>
    <div class="input-display" id="spelled-box"></div>
    <div class="keypad" id="keyboard"></div>
    <button style="margin-top:0.75rem; background:none; border:1px solid #78716c; color:#d6d3d1; padding:0.4rem 0.8rem; border-radius:4px; cursor:pointer;" id="clear-btn" onclick="clearWord()">Clear</button>
    <div class="status-msg" id="status-out"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      const alreadyFinished = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');

      if (alreadyFinished) return false;

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
      return true;
    }

    // Foundational 3-4 letter words
    const WORDS = [
      { word: "BEE", clue: "Buzzing insect that makes sweet honey 🐝" },
      { word: "FROG", clue: "Green pond animal that hops and ribbits 🐸" },
      { word: "TREE", clue: "Tall plant with a brown trunk and green leaves 🌳" }
    ];
    let wIdx = 0, buffer = "";

    function speakCurrentWord() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(WORDS[wIdx].word);
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      } else {
        document.getElementById('status-out').textContent = `Audio unavailable. Word has ${WORDS[wIdx].word.length} letters.`;
      }
    }

    function renderUI() {
      const status = document.getElementById('status-out');
      status.textContent = "";

      if (wIdx >= WORDS.length) {
        document.getElementById('spelled-box').textContent = "SWARM CALMED! 🐝";
        
        // Remove interactive input elements once complete
        const hearBtn = document.getElementById('hear-btn');
        if (hearBtn) hearBtn.remove();
        const clearBtn = document.getElementById('clear-btn');
        if (clearBtn) clearBtn.remove();
        const clueText = document.getElementById('clue-text');
        if (clueText) clueText.remove();
        document.getElementById('keyboard').innerHTML = "";
        
        const isNew = awardGameCompletion('spelling_bee_swarm');
        status.style.color = "var(--success)";
        if (isNew) {
          status.textContent = "🍃 +20 Leaves Earned!";
        } else {
          status.textContent = "🌿 Swarm Re-cleared! (Leaves already collected)";
        }
        playTone(520, 'sine', 0.2);
        return;
      }
      document.getElementById('hive-stat').textContent = `Word: ${wIdx + 1} / ${WORDS.length}`;
      document.getElementById('clue-text').textContent = "Clue: " + WORDS[wIdx].clue;
      document.getElementById('spelled-box').textContent = buffer;
    }

    function initKeys() {
      const kb = document.getElementById('keyboard');
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(ch => {
        const b = document.createElement('button');
        b.className = 'key-b'; b.textContent = ch;
        b.onclick = () => {
          buffer += ch;
          playTone(420, 'triangle', 0.08);
          renderUI();
          if (buffer.length === WORDS[wIdx].word.length) {
            if (buffer === WORDS[wIdx].word) {
              playTone(587, 'sine', 0.2);
              wIdx++;
              buffer = "";
              renderUI();
            } else {
              playTone(150, 'sawtooth', 0.3, true);
              const box = document.getElementById('spelled-box');
              box.classList.add('wrong');
              document.getElementById('status-out').textContent = "Try again! Tap Clear to retry.";
              setTimeout(() => box.classList.remove('wrong'), 700);
            }
          }
        };
        kb.appendChild(b);
      });
    }

    function clearWord() {
      buffer = "";
      document.getElementById('status-out').textContent = "";
      renderUI();
    }
    initKeys(); renderUI();
  </script>
</body>
</html>
