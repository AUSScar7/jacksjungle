<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Optical Canopy - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1a1608; --card: #2e2612; --accent: #facc15; --accent-dim: #ca8a04;
      --text: #fefce8; --muted: #fef08a; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 440px; padding: 1.25rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .grid { display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(3, 72px); gap: 6px; margin: 1.2rem 0; }
    .cell {
      background: #3e3318; border: 2px solid #574822; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .cell.mirror { color: var(--accent); font-weight: bold; }
    .cell.sun { background: rgba(250, 204, 21, 0.2); border-color: var(--accent); }
    .cell.flower { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; }
    .cell.wrong {
      border-color: var(--danger) !important;
      background: #451a1a !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .trace-btn { width: 100%; padding: 0.85rem; background: var(--accent); color: #000; font-weight: 800; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .trace-btn:active { background: var(--accent-dim); }
    .status-msg { height: 1.5rem; font-size: 0.9rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span>Raycast Reflection</span>
    </div>
    <p style="color: var(--muted); font-size: 0.85rem; text-align: center;">Tap mirrors to redirect the beam ☀️ into the 🌸 Orchid:</p>
    <div class="grid" id="optics-grid"></div>
    <button class="trace-btn" onclick="traceBeam()">⚡ Trace Solar Beam</button>
    <div class="status-msg" id="status-out"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    // Mirrors: 0 = '╲' (reflects right-to-down / up-to-left), 1 = '╱' (reflects down-to-left / right-to-up)
    let m1 = 0, m2 = 1;
    let isWon = false;

    function renderGrid() {
      const g = document.getElementById('optics-grid');
      g.innerHTML = '';
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const d = document.createElement('div');
          d.className = 'cell';
          d.id = `opt-${r}-${c}`;
          if (r === 0 && c === 0) {
            d.classList.add('sun'); d.textContent = '☀️';
          } else if (r === 0 && c === 2) {
            d.classList.add('mirror');
            d.textContent = m1 === 0 ? '╲' : '╱';
            d.onclick = () => {
              if (isWon) return;
              m1 = (m1 + 1) % 2;
              playTone(400, 'triangle', 0.08);
              renderGrid();
            };
          } else if (r === 2 && c === 2) {
            d.classList.add('mirror');
            d.textContent = m2 === 0 ? '╲' : '╱';
            d.onclick = () => {
              if (isWon) return;
              m2 = (m2 + 1) % 2;
              playTone(400, 'triangle', 0.08);
              renderGrid();
            };
          } else if (r === 2 && c === 0) {
            d.classList.add('flower'); d.textContent = '🌸';
          } else {
            d.style.opacity = '0.25'; d.textContent = '•';
          }
          g.appendChild(d);
        }
      }
    }

    function traceBeam() {
      if (isWon) return;
      document.getElementById('status-out').textContent = '';

      if (m1 === 0 && m2 === 1) {
        isWon = true;
        playTone(520, 'sine', 0.2);
        setTimeout(() => playTone(659, 'sine', 0.25), 150);
        const status = document.getElementById('status-out');
        status.style.color = 'var(--muted)';
        status.textContent = 'SOLAR BEAM CONNECTED! 🍃 +20 Leaves Earned.';
        awardGameCompletion('optical_canopy');
      } else {
        playTone(160, 'sawtooth', 0.3, true);
        const cell1 = document.getElementById('opt-0-2');
        const cell2 = document.getElementById('opt-2-2');
        if (cell1) cell1.classList.add('wrong');
        if (cell2) cell2.classList.add('wrong');
        document.getElementById('status-out').textContent = 'The light escaped into the trees! Re-align mirror facets.';
        setTimeout(() => {
          if (cell1) cell1.classList.remove('wrong');
          if (cell2) cell2.classList.remove('wrong');
        }, 700);
      }
    }

    renderGrid();
  </script>
</body>
</html>
