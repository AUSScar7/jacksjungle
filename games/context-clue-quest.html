<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Context Clue Quest - Jack's Jungle</title>
  <style>
    :root {
      --bg: #061a12; --card: #0d2b1f; --accent: #22c55e; --accent-dim: #15803d;
      --text: #f8fafc; --muted: #86efac; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .passage { background: rgba(0,0,0,0.35); border-left: 3px solid var(--accent); padding: 1rem; border-radius: 0.4rem; font-size: 1.05rem; line-height: 1.5; margin: 1rem 0; color: #fff; }
    .highlight { color: var(--accent); font-weight: bold; text-decoration: underline; }
    .grid { display: flex; flex-direction: column; gap: 0.6rem; width: 100%; }
    .opt-btn {
      background: #143d2c; border: 2px solid var(--accent-dim); color: #fff; padding: 0.85rem;
      border-radius: 0.5rem; font-size: 1rem; cursor: pointer; font-weight: 600; text-align: left;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .opt-btn:active { background: var(--accent-dim); }
    .opt-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.4rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="stage-lbl">Passage: 1 / 3</span>
    </div>
    <div class="passage" id="passage-body"></div>
    <p style="font-size: 0.9rem; color: var(--muted); margin-bottom: 0.5rem;" id="query-lbl">What does the highlighted word mean?</p>
    <div class="grid" id="choices-box"></div>
    <div class="status-msg" id="status-out"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    const PASSAGES = [
      {
        html: "The canopy fog was so <span class='highlight'>dense</span> that explorers could barely see the vines three feet ahead.",
        word: "dense", correct: "Thick and closely packed together",
        opts: ["Clear and open", "Thick and closely packed together", "Bright and hot"]
      },
      {
        html: "The chameleon remained <span class='highlight'>dormant</span> on the branch, not moving a single muscle for hours.",
        word: "dormant", correct: "Inactive or resting",
        opts: ["Running wildly", "Hunting aggressively", "Inactive or resting"]
      },
      {
        html: "Native seeds <span class='highlight'>thrive</span> in the nutrient-rich volcanic soil beneath the canopy.",
        word: "thrive", correct: "Grow vigorously and healthily",
        opts: ["Grow vigorously and healthily", "Dry out completely", "Freeze instantly"]
      }
    ];
    let pIdx = 0;

    function renderPassage() {
      const status = document.getElementById('status-out');
      status.textContent = "";

      if (pIdx >= PASSAGES.length) {
        document.getElementById('passage-body').textContent = "QUEST COMPLETE! Forest Floor Cleared.";
        document.getElementById('choices-box').innerHTML = "";
        status.style.color = "var(--muted)";
        status.textContent = "🍃 +20 Leaves Earned!";
        awardGameCompletion('context_clue_quest');
        playTone(520, 'sine', 0.2);
        return;
      }
      const p = PASSAGES[pIdx];
      document.getElementById('stage-lbl').textContent = `Passage: ${pIdx + 1} / ${PASSAGES.length}`;
      document.getElementById('passage-body').innerHTML = p.html;
      const cb = document.getElementById('choices-box');
      cb.innerHTML = "";

      p.opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'opt-btn'; b.textContent = opt;
        b.onclick = () => {
          if (opt === p.correct) {
            playTone(480, 'triangle', 0.15);
            pIdx++;
            renderPassage();
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = "Re-read the narrative context and try again!";
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        cb.appendChild(b);
      });
    }
    renderPassage();
  </script>
</body>
</html>
