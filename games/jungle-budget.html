<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jungle Budget - Jack's Jungle</title>
  <style>
    :root {
      --bg: #1c150c; --card: #2c2013; --accent: #eab308; --accent-dim: #ca8a04;
      --text: #fefce8; --muted: #fef08a; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .balance-box { font-size: 2.2rem; font-weight: 800; color: #fff; margin: 1rem 0; }
    .prompt-text { font-size: 1rem; text-align: center; color: var(--muted); line-height: 1.5; margin-bottom: 1.5rem; }
    .grid { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }
    .opt-btn {
      background: #423019; border: 2px solid var(--accent-dim); color: #fff; padding: 1rem;
      font-size: 1.15rem; font-weight: bold; border-radius: 0.6rem; cursor: pointer; text-align: left;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .opt-btn:active { background: var(--accent-dim); }
    .opt-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="round-indicator">Expedition: 1 / 3</span>
    </div>
    <div class="balance-box" id="grant-display">Budget: $100 AUD</div>
    <p class="prompt-text" id="budget-scenario"></p>
    <div class="grid" id="choices-grid"></div>
    <div class="status-msg" id="status-label"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    const EXPEDITIONS = [
      { grant: 100, prompt: "You buy a Solar Sensor for $35 AUD and 2 Water Test Kits for $15 AUD each. How much AUD remains?", correct: "$35 AUD", opts: ["$25 AUD", "$35 AUD", "$45 AUD"] },
      { grant: 150, prompt: "You rent climbing gear for $80 AUD and purchase a Field Net for $28 AUD. What is your remaining balance?", correct: "$42 AUD", opts: ["$32 AUD", "$42 AUD", "$52 AUD"] },
      { grant: 200, prompt: "A field drone costs $125 AUD. Replacement batteries cost $30 AUD. How much grant funding is left over?", correct: "$45 AUD", opts: ["$35 AUD", "$45 AUD", "$55 AUD"] }
    ];
    let eIdx = 0;

    function renderExpedition() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (eIdx >= EXPEDITIONS.length) {
        document.getElementById('grant-display').textContent = "LEDGER BALANCED!";
        document.getElementById('budget-scenario').textContent = "All field expenses audited successfully.";
        document.getElementById('choices-grid').innerHTML = "";
        status.style.color = "var(--muted)";
        status.textContent = "🍃 +20 Leaves Earned!";
        awardGameCompletion('jungle_budget');
        playTone(520, 'sine', 0.2);
        return;
      }
      const exp = EXPEDITIONS[eIdx];
      document.getElementById('round-indicator').textContent = `Expedition: ${eIdx + 1} / ${EXPEDITIONS.length}`;
      document.getElementById('grant-display').textContent = `Budget: $${exp.grant} AUD`;
      document.getElementById('budget-scenario').textContent = exp.prompt;

      const grid = document.getElementById('choices-grid');
      grid.innerHTML = "";
      exp.opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = opt;
        b.onclick = () => {
          if (opt === exp.correct) {
            playTone(480, 'triangle', 0.15);
            eIdx++; renderExpedition();
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = "Calculate total item costs before subtracting from the grant!";
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        grid.appendChild(b);
      });
    }
    renderExpedition();
  </script>
</body>
</html>
