<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>River Crossing - Jack's Jungle</title>
  <style>
    :root {
      --bg: #091a18; --card: #132d29; --accent: #14b8a6; --accent-dim: #0f766e;
      --text: #f0fdfa; --muted: #99f6e4; --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .river-scene {
      width: 100%; background: #0c201d; border: 1px solid var(--accent-dim); border-radius: 0.5rem;
      padding: 1rem; margin: 1rem 0; font-size: 0.95rem; line-height: 1.6;
    }
    .bank { min-height: 2.5rem; border-bottom: 1px dashed var(--accent-dim); padding-bottom: 0.5rem; margin-bottom: 0.5rem; }
    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; width: 100%; }
    .action-btn { background: #19443e; border: 2px solid var(--accent-dim); color: #fff; padding: 0.85rem; font-weight: bold; border-radius: 0.5rem; cursor: pointer; font-size: 0.95rem; }
    .action-btn:active { background: var(--accent-dim); }
    .status-lbl { height: 1.5rem; font-weight: 600; color: var(--danger); font-size: 0.9rem; text-align: center; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span>Constraint Logic</span>
    </div>
    <p style="color: var(--muted); font-size: 0.85rem; text-align: center;">Rule: The Dingo cannot be left alone with the Bush Turkey without the Ranger!</p>
    <div class="river-scene">
      <div class="bank" id="left-bank"><strong>Left Bank:</strong> Ranger, Dingo, Turkey</div>
      <div class="bank" style="border-bottom:none;" id="right-bank"><strong>Right Bank:</strong> (Empty)</div>
    </div>
    <div class="btn-grid">
      <button class="action-btn" onclick="takeItem('Dingo')">Take Dingo</button>
      <button class="action-btn" onclick="takeItem('Turkey')">Take Turkey</button>
      <button class="action-btn" onclick="takeItem('Alone')">Row Alone</button>
      <button class="action-btn" style="border-color:#f87171; color:#f87171;" onclick="resetPuzzle()">Restart</button>
    </div>
    <div class="status-lbl" id="error-msg"></div>
  </div>
  <script>
    let left = ['Dingo', 'Turkey'], right = [], rangerPos = 'left';

    function updateView() {
      document.getElementById('left-bank').innerHTML = `<strong>Left Bank:</strong> ${rangerPos === 'left' ? '🤠 Ranger, ' : ''}${left.join(', ') || '(Empty)'}`;
      document.getElementById('right-bank').innerHTML = `<strong>Right Bank:</strong> ${rangerPos === 'right' ? '🤠 Ranger, ' : ''}${right.join(', ') || '(Empty)'}`;

      // Check failure condition: Dingo & Turkey alone on either bank
      const dingoOnLeft = left.includes('Dingo') && left.includes('Turkey') && rangerPos === 'right';
      const dingoOnRight = right.includes('Dingo') && right.includes('Turkey') && rangerPos === 'left';
      if (dingoOnLeft || dingoOnRight) {
        document.getElementById('error-msg').textContent = "The Dingo chased the Turkey away! Restarting...";
        setTimeout(resetPuzzle, 1500);
        return;
      }

      if (right.length === 2 && right.includes('Dingo') && right.includes('Turkey')) {
        document.getElementById('error-msg').style.color = 'var(--accent)';
        document.getElementById('error-msg').textContent = "CROSSING COMPLETE! +20 Leaves Added.";
        let l = parseInt(localStorage.getItem('jacksjungle_leaves') || '0', 10);
        localStorage.setItem('jacksjungle_leaves', l + 20);
        localStorage.setItem('jacksjungle_sunlight', l + 20);
        localStorage.setItem('jacksjungle_completed_river_crossing', 'true');
      }
    }

    function takeItem(item) {
      document.getElementById('error-msg').textContent = "";
      if (rangerPos === 'left') {
        if (item !== 'Alone') {
          const idx = left.indexOf(item);
          if (idx === -1) return;
          left.splice(idx, 1);
          right.push(item);
        }
        rangerPos = 'right';
      } else {
        if (item !== 'Alone') {
          const idx = right.indexOf(item);
          if (idx === -1) return;
          right.splice(idx, 1);
          left.push(item);
        }
        rangerPos = 'left';
      }
      updateView();
    }

    function resetPuzzle() {
      left = ['Dingo', 'Turkey']; right = []; rangerPos = 'left';
      document.getElementById('error-msg').textContent = "";
      updateView();
    }
    updateView();
  </script>
</body>
</html>
