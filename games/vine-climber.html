<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vine Climber - Jack's Jungle</title>
  <style>
    :root {
      --bg: #061a12; --card: #0d2b1f; --accent: #22c55e; --accent-dim: #15803d;
      --text: #f8fafc; --muted: #86efac; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .vine-meter-track { width: 100%; height: 14px; background: rgba(0,0,0,0.4); border-radius: 7px; overflow: hidden; margin-bottom: 1.5rem; border: 1px solid var(--accent-dim); }
    .vine-meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #15803d, var(--accent)); transition: width 0.3s ease; }
    .word-prompt { font-size: 1.05rem; color: var(--muted); margin-bottom: 0.5rem; text-align: center; min-height: 2.5rem; }
    .word-display { font-size: 2.2rem; font-weight: 800; letter-spacing: 0.25rem; color: #ffffff; margin-bottom: 1.5rem; display: flex; gap: 0.4rem; }
    .letter-slot { border-bottom: 3px solid var(--accent); min-width: 2rem; text-align: center; }
    .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; width: 100%; margin-bottom: 1rem; }
    .opt-btn {
      background: #143d2c; color: var(--text); border: 2px solid var(--accent-dim);
      border-radius: 0.6rem; padding: 1rem; font-size: 1.3rem; font-weight: bold; cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .opt-btn:active { background: var(--accent-dim); }
    .opt-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.92rem; font-weight: 600; text-align: center; color: var(--danger); }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="score-readout">Height: 0m (1 / 6)</span>
    </div>
    <div class="vine-meter-track"><div id="vine-fill" class="vine-meter-fill"></div></div>
    <div class="word-prompt" id="prompt-clue">Definition: A dense tropical forest</div>
    <div class="word-display" id="word-target"></div>
    <div class="options-grid" id="options-container"></div>
    <div class="status-msg" id="status-label"></div>
  </div>

  <script>
    let audioCtx = null;
    function playBeep(freq, type, duration, isError = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isError) {
        osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + duration);
      }
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function awardGameCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      
      const alreadyFinished = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');

      // Stop! If already done once, do not add more leaves
      if (alreadyFinished) {
        return false;
      }

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
      return true;
    }

    const WORDS = [
      { clue: "Dense tropical wilderness", full: "JUNGLE", missing: 2 },
      { clue: "High green tree leaves", full: "CANOPY", missing: 1 },
      { clue: "Bright bird with large colorful bill", full: "TOUCAN", missing: 3 },
      { clue: "Slow-moving tree mammal", full: "SLOTH", missing: 2 },
      { clue: "Colorful blooming plant petal", full: "FLOWER", missing: 2 },
      { clue: "Fierce spotted apex predator", full: "JAGUAR", missing: 3 }
    ];

    let currentIdx = 0;

    function renderQuestion() {
      const status = document.getElementById('status-label');
      status.textContent = "";
      status.style.color = "var(--danger)";

      if (currentIdx >= WORDS.length) {
        document.getElementById('score-readout').textContent = `Height: 60m (6 / 6)`;
        document.getElementById('vine-fill').style.width = `100%`;
        document.getElementById('word-target').innerHTML = "CANOPY REACHED!";
        document.getElementById('prompt-clue').textContent = "Vine successfully anchored to the treetops.";
        document.getElementById('options-container').innerHTML = "";
        
        const isNewCompletion = awardGameCompletion('vine_climber');
        status.style.color = "var(--muted)";
        if (isNewCompletion) {
          status.textContent = "🍃 +20 Leaves Earned!";
        } else {
          status.textContent = "🌿 Challenge Re-cleared! (Leaves already collected)";
        }
        
        playBeep(523.25, 'sine', 0.15);
        setTimeout(() => playBeep(659.25, 'sine', 0.25), 140);
        return;
      }

      const q = WORDS[currentIdx];
      const heightMeters = currentIdx * 10;
      const progressPercent = Math.round((currentIdx / WORDS.length) * 100);
      
      document.getElementById('score-readout').textContent = `Height: ${heightMeters}m (${currentIdx + 1} / ${WORDS.length})`;
      document.getElementById('vine-fill').style.width = `${progressPercent}%`;
      document.getElementById('prompt-clue').textContent = "Clue: " + q.clue;
      const targetChar = q.full[q.missing];
      
      let displayHtml = "";
      for (let i = 0; i < q.full.length; i++) {
        displayHtml += (i === q.missing) ? `<span class="letter-slot">_</span>` : `<span class="letter-slot">${q.full[i]}</span>`;
      }
      document.getElementById('word-target').innerHTML = displayHtml;

      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let choices = [targetChar];
      while (choices.length < 4) {
        let rand = alphabet[Math.floor(Math.random() * alphabet.length)];
        if (!choices.includes(rand)) choices.push(rand);
      }
      choices.sort(() => Math.random() - 0.5);

      const optsBox = document.getElementById('options-container');
      optsBox.innerHTML = "";
      choices.forEach(char => {
        const btn = document.createElement('button');
        btn.className = "opt-btn";
        btn.textContent = char;
        btn.onclick = () => {
          if (char === targetChar) {
            playBeep(440, 'triangle', 0.15);
            currentIdx++;
            renderQuestion();
          } else {
            playBeep(160, 'sawtooth', 0.3, true);
            btn.classList.add('wrong');
            status.textContent = `"${char}" is incorrect! Choose another letter.`;
            setTimeout(() => btn.classList.remove('wrong'), 700);
          }
        };
        optsBox.appendChild(btn);
      });
    }
    renderQuestion();
  </script>
</body>
</html>
