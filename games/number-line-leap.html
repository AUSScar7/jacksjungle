<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Number Line Leap - Jack's Jungle</title>
  <style>
    :root {
      --bg: #141b17; --card: #202d26; --accent: #34d399; --accent-dim: #059669;
      --text: #ecfdf5; --muted: #a7f3d0; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .target-val { font-size: 2.8rem; font-weight: 800; color: #fff; margin: 1.5rem 0; }
    .line-container { width: 100%; position: relative; margin: 1.5rem 0; padding: 0 10px; }
    .vine-bar { width: 100%; height: 8px; background: var(--accent-dim); border-radius: 4px; position: relative; }
    .labels-row { display: flex; justify-content: space-between; margin-top: 8px; font-weight: bold; color: var(--muted); }
    .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; width: 100%; margin-top: 1rem; }
    .slot-btn {
      background: #134e3b; border: 2px solid var(--accent-dim); color: #fff; padding: 0.85rem;
      border-radius: 0.5rem; font-weight: bold; cursor: pointer; font-size: 1.1rem;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .slot-btn:active { background: var(--accent-dim); }
    .slot-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="leap-count">Leap: 1 / 4</span>
    </div>
    <p style="color: var(--muted); font-size: 0.95rem;">Which vine segment contains this value?</p>
    <div class="target-val" id="target-number">1.75</div>
    <div class="line-container">
      <div class="vine-bar"></div>
      <div class="labels-row">
        <span>0</span>
        <span>1</span>
        <span>2</span>
        <span>3</span>
      </div>
    </div>
    <div class="btn-grid" id="zones-box"></div>
    <div class="status-msg" id="status-label"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    const LEAPS = [
      { val: "1.75", range: "Between 1 and 2", opts: ["Between 0 and 1", "Between 1 and 2", "Between 2 and 3"] },
      { val: "2 ½", range: "Between 2 and 3", opts: ["Between 0 and 1", "Between 1 and 2", "Between 2 and 3"] },
      { val: "0.4", range: "Between 0 and 1", opts: ["Between 0 and 1", "Between 1 and 2", "Between 2 and 3"] },
      { val: "2.85", range: "Between 2 and 3", opts: ["Between 0 and 1", "Between 1 and 2", "Between 2 and 3"] }
    ];
    let lIdx = 0;

    function renderLeap() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (lIdx >= LEAPS.length) {
        document.getElementById('target-number').textContent = "VINE CROSSED!";
        document.getElementById('zones-box').innerHTML = "";
        status.style.color = "var(--muted)";
        status.textContent = "🍃 +20 Leaves Earned!";
        awardGameCompletion('number_line_leap');
        playTone(520, 'sine', 0.2);
        return;
      }
      const item = LEAPS[lIdx];
      document.getElementById('leap-count').textContent = `Leap: ${lIdx + 1} / ${LEAPS.length}`;
      document.getElementById('target-number').textContent = item.val;

      const zBox = document.getElementById('zones-box');
      zBox.innerHTML = "";
      item.opts.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'slot-btn';
        b.textContent = opt.replace("Between ", "");
        b.onclick = () => {
          if (opt === item.range) {
            playTone(480, 'triangle', 0.15);
            lIdx++; renderLeap();
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = `Compare whole number boundaries for ${item.val}!`;
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        zBox.appendChild(b);
      });
    }
    renderLeap();
  </script>
</body>
</html>
