<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Perimeter Patrol - Jack's Jungle</title>
  <style>
    :root {
      --bg: #091815; --card: #132a24; --accent: #10b981; --accent-dim: #059669;
      --text: #f0fdf4; --muted: #6ee7b7; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .fence-diagram {
      width: 200px; height: 140px; border: 3px dashed var(--accent); border-radius: 0.5rem;
      margin: 1.5rem 0; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 0.5rem;
      font-weight: bold; font-size: 1.1rem; color: #fff;
    }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; width: 100%; }
    .choice-btn {
      background: #1d3d34; border: 2px solid var(--accent-dim); color: #fff; padding: 1rem;
      font-size: 1.25rem; font-weight: bold; border-radius: 0.6rem; cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .choice-btn:active { background: var(--accent-dim); }
    .choice-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.95rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="patrol-lbl">Enclosure: 1 / 3</span>
    </div>
    <p style="color: var(--muted); font-size: 0.9rem;">Calculate the total Perimeter (sum of all 4 sides):</p>
    <div class="fence-diagram">
      <span id="top-w">6m</span>
      <div style="width: 100%; display: flex; justify-content: space-between;">
        <span id="left-h">4m</span>
        <span id="right-h">4m</span>
      </div>
      <span id="bot-w">6m</span>
    </div>
    <div class="grid" id="patrol-options"></div>
    <div class="status-msg" id="status-label"></div>
  </div>
  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      localStorage.setItem(`jacksjungle_completed_${gameId}`, 'true');
      localStorage.setItem(`jacksjungle_completed_${gameId.replace(/_/g, '-')}`, 'true');
      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;
      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
    }

    const FENCES = [
      { w: 6, h: 4, perim: 20, distractors: [24, 10, 16] },
      { w: 8, h: 5, perim: 26, distractors: [40, 13, 28] },
      { w: 10, h: 3, perim: 26, distractors: [30, 16, 20] }
    ];
    let pStep = 0;

    function loadFence() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (pStep >= FENCES.length) {
        document.querySelector('.fence-diagram').innerHTML = "PATROL SECURED!";
        document.getElementById('patrol-options').innerHTML = "";
        status.style.color = "var(--muted)";
        status.textContent = "🍃 +20 Leaves Earned!";
        awardGameCompletion('perimeter_patrol');
        playTone(520, 'sine', 0.2);
        return;
      }
      const f = FENCES[pStep];
      document.getElementById('patrol-lbl').textContent = `Enclosure: ${pStep + 1} / ${FENCES.length}`;
      document.getElementById('top-w').textContent = `${f.w}m`;
      document.getElementById('bot-w').textContent = `${f.w}m`;
      document.getElementById('left-h').textContent = `${f.h}m`;
      document.getElementById('right-h').textContent = `${f.h}m`;

      let opts = [f.perim, ...f.distractors].sort(() => Math.random() - 0.5);
      const box = document.getElementById('patrol-options');
      box.innerHTML = "";
      opts.forEach(ans => {
        const b = document.createElement('button');
        b.className = 'choice-btn'; b.textContent = `${ans}m`;
        b.onclick = () => {
          if (ans === f.perim) {
            playTone(480, 'triangle', 0.15);
            pStep++; loadFence();
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = `Remember: Perimeter = ${f.w} + ${f.h} + ${f.w} + ${f.h}!`;
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        box.appendChild(b);
      });
    }
    loadFence();
  </script>
</body>
</html>
