<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Canopy Crosswords - Jack's Jungle</title>
  <style>
    :root {
      --bg: #141724; --card: #1e2238; --accent: #6366f1; --accent-dim: #4338ca;
      --text: #e0e7ff; --muted: #a5b4fc; --danger: #ef4444; --success: #22c55e;
      --gold: #facc15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .cw-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.25rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; font-size: 0.9rem; }
    .nav-btn { background: transparent; border: 1px solid var(--accent); color: var(--text); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }

    /* Clue Selection Cards */
    .clues-container { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 0.75rem; }
    .clue-card {
      background: rgba(0, 0, 0, 0.35); border: 2px solid #312e81; border-radius: 0.5rem;
      padding: 0.5rem 0.65rem; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
      min-height: 62px; transition: all 0.15s ease;
    }
    .clue-card.active { border-color: var(--accent); background: rgba(99, 102, 241, 0.25); }
    .clue-card.completed { border-color: var(--success); opacity: 0.85; }
    .clue-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.85rem; color: #fff; }
    .clue-sub { font-size: 0.75rem; color: var(--muted); line-height: 1.25; margin-top: 2px; }

    /* 5x5 Crossword Grid */
    .grid-container {
      display: grid; grid-template-columns: repeat(5, 46px); grid-template-rows: repeat(5, 46px);
      gap: 5px; margin: 0.5rem 0 0.75rem;
    }
    .cell {
      background: #111425; border: 2px solid #2d3356; border-radius: 6px;
      color: #fff; font-size: 1.35rem; font-weight: 800; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease; position: relative; cursor: pointer;
    }
    .cell.blocked { background: transparent; border-color: transparent; cursor: default; }
    .cell.active-word { border-color: var(--accent); background: rgba(99, 102, 241, 0.2); }
    .cell.shared-cell::after {
      content: "•"; position: absolute; top: 2px; right: 4px; font-size: 0.8rem; color: var(--gold);
    }
    .cell.wrong {
      border-color: var(--danger) !important;
      background: #451a1a !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Friendly Letter Bank */
    .bank-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
    .letter-bank { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; width: 100%; margin-bottom: 0.5rem; }
    .key-btn {
      background: #312e81; color: #fff; border: 2px solid var(--accent); border-radius: 6px;
      width: 42px; height: 42px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: transform 0.1s ease, background 0.15s ease;
    }
    .key-btn:active { transform: scale(0.95); background: var(--accent-dim); }
    .action-btn { width: auto; padding: 0 0.85rem; font-size: 0.85rem; border-color: #64748b; background: #1e293b; height: 38px; }

    .status-msg { height: 1.4rem; font-size: 0.9rem; font-weight: bold; text-align: center; color: var(--danger); margin-top: 0.3rem; }
  </style>
</head>
<body>
  <div class="cw-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span style="font-weight: 700; color: var(--muted);">Forest Crosswords (4 Words)</span>
    </div>

    <!-- 4 Easy Clues -->
    <div class="clues-container">
      <div class="clue-card active" id="clue-1" onclick="selectWord(1)">
        <div class="clue-header"><span>1. FROG (Across)</span><span id="chk-1">✏️</span></div>
        <div class="clue-sub">Green jumper that ribbits!</div>
      </div>
      <div class="clue-card" id="clue-2" onclick="selectWord(2)">
        <div class="clue-header"><span>2. TREE (Down)</span><span id="chk-2">✏️</span></div>
        <div class="clue-sub">Tall plant with leafy branches.</div>
      </div>
      <div class="clue-card" id="clue-3" onclick="selectWord(3)">
        <div class="clue-header"><span>3. NEST (Across)</span><span id="chk-3">✏️</span></div>
        <div class="clue-sub">A cozy twig home for eggs.</div>
      </div>
      <div class="clue-card" id="clue-4" onclick="selectWord(4)">
        <div class="clue-header"><span>4. VINE (Down)</span><span id="chk-4">✏️</span></div>
        <div class="clue-sub">Long leafy rope you can swing on!</div>
      </div>
    </div>

    <!-- 5x5 Crossword Grid -->
    <div class="grid-container" id="crossword-grid"></div>

    <div class="bank-label">Tap a letter to spell the highlighted word:</div>
    <div class="letter-bank" id="letter-tray"></div>

    <div style="display: flex; gap: 0.5rem; width: 100%; justify-content: center;">
      <button class="key-btn action-btn" onclick="eraseLastLetter()">⌫ Backspace</button>
      <button class="key-btn action-btn" style="border-color: #ef4444;" onclick="clearSelectedWord()">Clear Word</button>
    </div>

    <div class="status-msg" id="status-label"></div>
  </div>

  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      
      const alreadyFinished = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');

      if (alreadyFinished) {
        return false;
      }

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
      return true;
    }

    // 4 Kid-Friendly Rainforest Words in a 5x5 Grid
    // Word 1: FROG (Across, Row 1, Cols 0-3)
    // Word 2: TREE (Down,   Rows 0-3, Col 1) -> Intersects at [1,1] ('R')
    // Word 3: NEST (Across, Row 3, Cols 0-3) -> Intersects at [3,1] ('E')
    // Word 4: VINE (Down,   Rows 1-4, Col 4) -> Standalone column
    const WORDS = {
      1: { name: "FROG", cells: [[1,0], [1,1], [1,2], [1,3]] },
      2: { name: "TREE", cells: [[0,1], [1,1], [2,1], [3,1]] },
      3: { name: "NEST", cells: [[3,0], [3,1], [3,2], [3,3]] },
      4: { name: "VINE", cells: [[1,4], [2,4], [3,4], [4,4]] }
    };

    // Valid active cells (others are blocked '#')
    const VALID_CELLS = [
      [0,1],
      [1,0], [1,1], [1,2], [1,3], [1,4],
      [2,1], [2,4],
      [3,0], [3,1], [3,2], [3,3], [3,4],
      [4,4]
    ];

    let gridState = Array(5).fill(null).map(() => Array(5).fill('#'));
    VALID_CELLS.forEach(([r, c]) => { gridState[r][c] = ''; });

    let activeWordId = 1;
    let isCompleted = false;

    function selectWord(id) {
      if (isCompleted) return;
      activeWordId = id;
      for (let i = 1; i <= 4; i++) {
        const card = document.getElementById(`clue-${i}`);
        if (card) card.classList.toggle('active', i === id);
      }
      document.getElementById('status-label').textContent = '';
      playTone(400, 'triangle', 0.08);
      renderGrid();
    }

    function renderGrid() {
      const g = document.getElementById('crossword-grid');
      g.innerHTML = '';
      const activeCoords = WORDS[activeWordId].cells;

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const d = document.createElement('div');
          d.className = 'cell';
          d.id = `cell-${r}-${c}`;

          if (gridState[r][c] === '#') {
            d.classList.add('blocked');
          } else {
            d.textContent = gridState[r][c];
            
            // Highlight shared intersections
            if ((r === 1 && c === 1) || (r === 3 && c === 1)) {
              d.classList.add('shared-cell');
            }

            const isInActive = activeCoords.some(coord => coord[0] === r && coord[1] === c);
            if (isInActive && !isCompleted) d.classList.add('active-word');

            d.onclick = () => {
              // Contextual word switching on tap
              if (r === 1 && c === 1) selectWord(activeWordId === 1 ? 2 : 1);
              else if (r === 3 && c === 1) selectWord(activeWordId === 2 ? 3 : 2);
              else if (r === 1 && c <= 3) selectWord(1);
              else if (c === 1) selectWord(2);
              else if (r === 3 && c <= 3) selectWord(3);
              else if (c === 4) selectWord(4);
            };
          }
          g.appendChild(d);
        }
      }
      checkCompletion();
    }

    function buildLetterTray() {
      const tray = document.getElementById('letter-tray');
      tray.innerHTML = '';
      // All necessary letters + 3 light distractors
      const letters = ['F', 'R', 'O', 'G', 'T', 'E', 'N', 'S', 'V', 'I', 'A', 'M', 'L'];
      letters.forEach(ch => {
        const b = document.createElement('button');
        b.className = 'key-btn';
        b.textContent = ch;
        b.onclick = () => insertLetter(ch);
        tray.appendChild(b);
      });
    }

    function insertLetter(ch) {
      if (isCompleted) return;
      const targetCells = WORDS[activeWordId].cells;
      
      // Auto-advance: fill first open cell in the active word
      for (const [r, c] of targetCells) {
        if (gridState[r][c] === '') {
          gridState[r][c] = ch;
          playTone(460, 'triangle', 0.1);
          renderGrid();
          return;
        }
      }

      // Overwrite last cell if full
      const last = targetCells[targetCells.length - 1];
      gridState[last[0]][last[1]] = ch;
      playTone(460, 'triangle', 0.1);
      renderGrid();
    }

    function eraseLastLetter() {
      if (isCompleted) return;
      const targetCells = WORDS[activeWordId].cells;
      for (let i = targetCells.length - 1; i >= 0; i--) {
        const [r, c] = targetCells[i];
        if (gridState[r][c] !== '') {
          gridState[r][c] = '';
          playTone(340, 'triangle', 0.08);
          renderGrid();
          return;
        }
      }
    }

    function clearSelectedWord() {
      if (isCompleted) return;
      const targetCells = WORDS[activeWordId].cells;
      targetCells.forEach(([r, c]) => {
        // Protect shared letter if other word has it correct
        if (r === 1 && c === 1 && WORDS[2].cells.map(([ro, co]) => gridState[ro][co]).join('')[1] === 'R') return;
        if (r === 3 && c === 1 && WORDS[2].cells.map(([ro, co]) => gridState[ro][co]).join('')[3] === 'E') return;
        gridState[r][c] = '';
      });
      playTone(300, 'sawtooth', 0.1);
      renderGrid();
    }

    function checkCompletion() {
      let wordsDone = 0;
      let allFilled = true;

      for (let i = 1; i <= 4; i++) {
        const userWord = WORDS[i].cells.map(([r, c]) => gridState[r][c]).join('');
        const isRight = (userWord === WORDS[i].name);
        
        if (userWord.length < 4) allFilled = false;
        if (isRight) wordsDone++;

        const chk = document.getElementById(`chk-${i}`);
        if (chk) chk.textContent = isRight ? '✅' : '✏️';
        const card = document.getElementById(`clue-${i}`);
        if (card) card.classList.toggle('completed', isRight);
      }

      // All filled but errors present
      if (allFilled && wordsDone < 4) {
        playTone(160, 'sawtooth', 0.25, true);
        const status = document.getElementById('status-label');
        status.textContent = 'Some letters are mixed up. Re-check your spelling!';
        document.querySelectorAll('.cell:not(.blocked)').forEach(c => c.classList.add('wrong'));
        setTimeout(() => {
          document.querySelectorAll('.cell').forEach(c => c.classList.remove('wrong'));
        }, 700);
        return;
      }

      // 4 / 4 Complete!
      if (wordsDone === 4 && !isCompleted) {
        isCompleted = true;
        playTone(520, 'sine', 0.2);
        setTimeout(() => playTone(659, 'sine', 0.25), 150);
        
        const isNew = awardGameCompletion('canopy_crosswords');
        const status = document.getElementById('status-label');
        status.style.color = 'var(--success)';
        if (isNew) {
          status.textContent = 'CROSSWORD SOLVED! 🍃 +20 Leaves Earned.';
        } else {
          status.textContent = '🌿 Crossword Solved! (Leaves already collected)';
        }
      }
    }

    buildLetterTray();
    renderGrid();
  </script>
</body>
</html>
