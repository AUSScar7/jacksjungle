<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Negative Nesting - Jack's Jungle</title>
  <style>
    :root {
      --bg: #0b132b; --card: #1c2541; --accent: #3a86ff; --accent-dim: #1d4ed8;
      --text: #f0fdf4; --muted: #93c5fd; --danger: #ef4444; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem;
    }
    .game-box {
      background: var(--card); border: 2px solid var(--accent-dim); border-radius: 1rem;
      width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; font-size: 0.9rem; color: var(--muted); }
    .nav-btn { background: transparent; border: 1px solid var(--accent-dim); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 0.4rem; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    
    .elevator-board {
      background: rgba(0,0,0,0.35); border: 2px dashed var(--accent-dim); border-radius: 0.75rem;
      width: 100%; padding: 1rem; margin: 0.75rem 0; display: flex; align-items: center; justify-content: space-around;
    }
    .ladder { display: flex; flex-direction: column; gap: 4px; font-weight: 900; font-size: 0.95rem; }
    .floor-marker { padding: 2px 8px; border-radius: 4px; }
    .floor-marker.branch { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .floor-marker.ground { background: rgba(250, 204, 21, 0.25); color: #fde047; border: 1px solid #facc15; }
    .floor-marker.under { background: rgba(59, 130, 246, 0.25); color: #93c5fd; }
    
    .story-prompt { font-size: 1.05rem; font-weight: 600; text-align: center; color: #fff; line-height: 1.5; min-height: 3.2rem; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; width: 100%; margin-top: 0.5rem; }
    .opt-btn {
      background: #243356; border: 2px solid var(--accent); color: #fff; padding: 1rem 0.5rem;
      font-size: 1.5rem; font-weight: 900; border-radius: 0.6rem; cursor: pointer; text-align: center;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .opt-btn:active { background: var(--accent-dim); transform: scale(0.97); }
    .opt-btn.wrong {
      background: #451a1a !important;
      border-color: var(--danger) !important;
      color: #fca5a5 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg { height: 1.5rem; font-size: 0.92rem; font-weight: 600; text-align: center; color: var(--danger); margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="top-bar">
      <a class="nav-btn" href="../index.html">&larr; Canopy Hub</a>
      <span id="round-indicator">Elevator: 1 / 4</span>
    </div>

    <div class="elevator-board">
      <div class="ladder">
        <div class="floor-marker branch">+2 Top Canopy</div>
        <div class="floor-marker branch">+1 Low Branch</div>
        <div class="floor-marker ground">0 Ground Level</div>
        <div class="floor-marker under">-1 Shallow Burrow</div>
        <div class="floor-marker under">-2 Deep Roots</div>
      </div>
      <div style="font-size: 3rem;" id="roost-icon">🐒</div>
    </div>

    <div class="story-prompt" id="scenario-text">A monkey starts at Ground (0) and climbs down 2 floors into the tree roots.</div>
    <div class="grid" id="choices-grid"></div>
    <div class="status-msg" id="status-label"></div>
  </div>

  <script>
    let audioCtx = null;
    function playTone(freq, type, dur, isErr = false) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (isErr) osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function awardGameCompletion(gameId) {
      const k1 = `jacksjungle_completed_${gameId}`;
      const k2 = `jacksjungle_completed_${gameId.replace(/_/g, '-')}`;
      const alreadyFinished = (localStorage.getItem(k1) === 'true' || localStorage.getItem(k2) === 'true');
      localStorage.setItem(k1, 'true');
      localStorage.setItem(k2, 'true');

      if (alreadyFinished) return false;

      let currentLeaves = parseInt(localStorage.getItem('jacksjungle_leaves'), 10);
      if (isNaN(currentLeaves)) currentLeaves = 0;

      let updatedLeaves = currentLeaves + 20;
      localStorage.setItem('jacksjungle_leaves', updatedLeaves.toString());
      localStorage.setItem('jacksjungle_sunlight', updatedLeaves.toString());
      return true;
    }

    // Concrete elevator floor scenarios for kids
    const ROOSTS = [
      {
        text: "🐒 Start at Ground (0). A monkey hops down 2 levels below ground into the cool roots.",
        ans: -2, opts: [-2, -1, 0], hint: "Going below ground gives negative (-) floors!"
      },
      {
        text: "🦉 Start at -1 (Shallow Burrow). An owl flies up 2 floors into the sunny branch.",
        ans: 1, opts: [0, 1, 2], hint: "-1 goes up through 0 to +1!"
      },
      {
        text: "🦎 Start at +2 (Top Canopy). A lizard climbs down 3 floors into the soil.",
        ans: -1, opts: [-2, -1, 0], hint: "Count down: 2 -> 1 -> 0 -> -1!"
      },
      {
        text: "🐸 Start at -2 (Deep Roots). A frog hops up 2 floors to visit the forest floor.",
        ans: 0, opts: [-1, 0, 1], hint: "Climbing up 2 steps from -2 reaches Ground!"
      }
    ];

    let idx = 0;

    function renderRoost() {
      const status = document.getElementById('status-label');
      status.textContent = "";

      if (idx >= ROOSTS.length) {
        document.getElementById('scenario-text').textContent = "Elevator journey complete! You understand positive & negative tree floors.";
        document.getElementById('choices-grid').innerHTML = "";

        const isNew = awardGameCompletion('negative_nesting');
        status.style.color = "var(--success)";
        if (isNew) {
          status.textContent = "🍃 +20 Leaves Earned!";
        } else {
          status.textContent = "🌿 Roost Re-cleared! (Leaves already collected)";
        }

        playTone(520, 'sine', 0.2);
        setTimeout(() => playTone(659, 'sine', 0.25), 150);
        return;
      }

      const r = ROOSTS[idx];
      document.getElementById('round-indicator').textContent = `Elevator: ${idx + 1} / ${ROOSTS.length}`;
      document.getElementById('scenario-text').textContent = r.text;

      const grid = document.getElementById('choices-grid');
      grid.innerHTML = "";
      r.opts.forEach(val => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = val > 0 ? `+${val}` : `${val}`;
        b.onclick = () => {
          if (val === r.ans) {
            playTone(480, 'triangle', 0.15);
            idx++;
            renderRoost();
          } else {
            playTone(160, 'sawtooth', 0.25, true);
            b.classList.add('wrong');
            status.textContent = r.hint;
            setTimeout(() => b.classList.remove('wrong'), 700);
          }
        };
        grid.appendChild(b);
      });
    }
    renderRoost();
  </script>
</body>
</html>
